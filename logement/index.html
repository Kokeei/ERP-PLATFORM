<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPH · Gestion Locative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ink: #12211f; --ink-2: #4a5b58; --ink-3: #7a8a87;
  --bg: #eef1f0; --surface: #ffffff; --surface-2: #f6f8f7;
  --border: #d7dddb; --border-strong: #c2cac8;
  --primary: #0f6e6a; --primary-dark: #0a504d; --primary-soft: #e2efee; --primary-ink: #ffffff;
  --ok: #2f8f5b; --ok-bg:#e6f4ec; --warn: #b57812; --warn-bg:#fbf1dd; --bad: #c0453b; --bad-bg:#f9e6e4; --info:#2f6f9f; --info-bg:#e5eef6;
  --shadow: 0 1px 2px rgba(18,33,31,.06), 0 8px 24px rgba(18,33,31,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#e8efed; --ink-2:#a9b8b5; --ink-3:#7d8d8a;
  --bg:#0c1413; --surface:#131e1c; --surface-2:#0f1817;
  --border:#243230; --border-strong:#334340;
  --primary:#3aa39c; --primary-dark:#2b807a; --primary-soft:#12302e; --primary-ink:#04110f;
  --ok:#4bbd7f; --ok-bg:#123122; --warn:#d69a3c; --warn-bg:#332614; --bad:#e06b60; --bad-bg:#361c1a; --info:#5c9ecb; --info-bg:#132635;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --ink:#e8efed; --ink-2:#a9b8b5; --ink-3:#7d8d8a;
  --bg:#0c1413; --surface:#131e1c; --surface-2:#0f1817;
  --border:#243230; --border-strong:#334340;
  --primary:#3aa39c; --primary-dark:#2b807a; --primary-soft:#12302e; --primary-ink:#04110f;
  --ok:#4bbd7f; --ok-bg:#123122; --warn:#d69a3c; --warn-bg:#332614; --bad:#e06b60; --bad-bg:#361c1a; --info:#5c9ecb; --info-bg:#132635;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font); color:var(--ink); background:var(--bg); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit}

.app{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
.sidebar{background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; position:sticky; top:0; height:100vh}
.brand{padding:20px 20px 14px; display:flex; align-items:center; gap:11px}
.brand .logo{width:38px;height:38px;border-radius:9px;flex:0 0 auto; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:var(--primary-ink); display:grid; place-items:center; font-weight:800; font-size:16px}
.brand h1{font-size:15px; margin:0; line-height:1.15; font-weight:700}
.brand span{font-size:11.5px; color:var(--ink-3); font-weight:500}
.nav{padding:8px; overflow-y:auto; flex:1}
.nav-group{font-size:10.5px; letter-spacing:.06em; color:var(--ink-3); font-weight:700; padding:14px 12px 6px; text-transform:uppercase}
.nav a{display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px; color:var(--ink-2); text-decoration:none; font-weight:500; font-size:14px; cursor:pointer}
.nav a .ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
.nav a.active{background:var(--primary-soft); color:var(--primary-dark); font-weight:600}
.nav a .count{margin-left:auto; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px}
.sidebar-foot{padding:12px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.sidebar-foot select{flex:1; min-width:0; padding:6px 8px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:12.5px}
.theme-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2); border-radius:8px; padding:7px 9px; cursor:pointer; font-size:12.5px; display:flex; gap:6px; align-items:center}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{background:var(--surface); border-bottom:1px solid var(--border); padding:16px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5; flex-wrap:wrap}
.topbar h2{margin:0; font-size:19px; font-weight:700}
.topbar .sub{color:var(--ink-3); font-size:13px; margin-top:1px}
.topbar .spacer{flex:1}
.menu-toggle{display:none; background:none; border:1px solid var(--border); border-radius:8px; padding:8px; cursor:pointer; color:var(--ink)}
.content{padding:24px 28px 60px; max-width:1280px; width:100%}

.btn{display:inline-flex; align-items:center; gap:7px; border-radius:8px; border:1px solid transparent; padding:9px 15px; font-size:13.5px; font-weight:600; cursor:pointer; background:var(--surface-2); color:var(--ink); border-color:var(--border)}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:7px 9px}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:6px 11px; font-size:12.5px}
.btn.danger{color:var(--bad); border-color:var(--border)}
.btn.danger:hover{background:var(--bad-bg)}
.btn .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.btn:disabled{opacity:.5; cursor:not-allowed}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:22px}
.kpi{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow); cursor:pointer}
.kpi:hover{border-color:var(--border-strong)}
.kpi .k-lbl{font-size:12.5px; color:var(--ink-3); font-weight:600}
.kpi .k-val{font-size:30px; font-weight:800; margin-top:6px; letter-spacing:-.02em}
.kpi .k-meta{font-size:12px; margin-top:4px; font-weight:600}
.kpi .k-meta.ok{color:var(--ok)} .kpi .k-meta.warn{color:var(--warn)} .kpi .k-meta.bad{color:var(--bad)} .kpi .k-meta.mut{color:var(--ink-3)}

.panels{display:grid; grid-template-columns:1.4fr 1fr; gap:16px}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.panel-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
.panel-head h3{margin:0; font-size:14.5px; font-weight:700}
.panel-head .spacer{flex:1}
.panel-body{padding:6px 6px}
.mini-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px}
.mini-row:hover{background:var(--surface-2)}
.mini-row .who{font-weight:600; font-size:13.5px}
.mini-row .det{font-size:12.5px; color:var(--ink-3)}
.mini-row .spacer{flex:1}
.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13.5px}

.toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.search{position:relative; flex:1; min-width:200px; max-width:360px}
.search input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13.5px}
.search .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px;height:16px; stroke:var(--ink-3); fill:none; stroke-width:2}
.filter-sel{padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13.5px}
input:focus, select:focus, textarea:focus, .btn:focus-visible, .kpi:focus-visible, a:focus-visible{outline:2px solid var(--primary); outline-offset:1px}

.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13.5px}
thead th{text-align:left; padding:11px 14px; font-size:11.5px; letter-spacing:.02em; color:var(--ink-3); font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface-2)}
tbody td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.cell-name{font-weight:600}
.cell-sub{font-size:12px; color:var(--ink-3)}
.row-actions{display:flex; gap:4px; justify-content:flex-end; white-space:nowrap}

.av{width:32px;height:32px;border-radius:50%; background:var(--primary-soft); color:var(--primary-dark); display:grid; place-items:center; font-weight:700; font-size:12px; flex:0 0 auto}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap}
.badge::before{content:""; width:6px;height:6px;border-radius:50%; background:currentColor}
.badge.ok{background:var(--ok-bg); color:var(--ok)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.badge.bad{background:var(--bad-bg); color:var(--bad)}
.badge.info{background:var(--info-bg); color:var(--info)}
.badge.mut{background:var(--surface-2); color:var(--ink-3)}
.tag{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2)}

.overlay{position:fixed; inset:0; background:rgba(10,20,19,.5); backdrop-filter:blur(2px); display:grid; place-items:center; padding:20px; z-index:50}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:660px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px}
.modal-head h3{margin:0; font-size:17px; font-weight:700}
.modal-head .spacer{flex:1}
.modal-body{padding:20px 22px; overflow-y:auto}
.modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap}
.close-x{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:4px;border-radius:6px}
.close-x .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px}
.field{display:flex; flex-direction:column; gap:5px}
.field.full{grid-column:1 / -1}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.field label .req{color:var(--bad)}
.field input, .field select, .field textarea{padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:14px; width:100%}
.field textarea{resize:vertical; min-height:64px}
.field .hint{font-size:11.5px; color:var(--ink-3)}
.form-section{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); font-weight:700; grid-column:1/-1; margin-top:6px; padding-bottom:2px; border-bottom:1px solid var(--border)}

.detail-head{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px; flex-wrap:wrap}
.detail-head .av{width:56px;height:56px;font-size:20px}
.detail-head h2{margin:0; font-size:21px}
.detail-head .meta{color:var(--ink-3); font-size:13.5px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.detail-cols{display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start}
.info-list{display:flex; flex-direction:column}
.info-list .row{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px}
.info-list .row:last-child{border-bottom:none}
.info-list .row .l{color:var(--ink-3)}
.info-list .row .v{font-weight:600; text-align:right}
.tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:5px; margin-bottom:14px; overflow-x:auto}
.tabs button{background:none; border:none; padding:8px 14px; border-radius:7px; font-size:13px; font-weight:600; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.tabs button.active{background:var(--primary-soft); color:var(--primary-dark)}

.wf-item{display:flex; gap:12px; position:relative; padding:6px 0}
.wf-dot{width:9px;height:9px;border-radius:50%; background:var(--primary); margin-top:5px; flex:0 0 auto}
.wf-body{flex:1}
.wf-top{display:flex; justify-content:space-between; gap:10px; font-size:13.5px}
.wf-date{color:var(--ink-3); font-size:12px; white-space:nowrap}
.wf-actor{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.wf-comment{font-size:12.5px; color:var(--ink-3); margin-top:4px; font-style:italic}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:9px; font-size:13.5px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.3); z-index:80; opacity:0; transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:960px){ .panels{grid-template-columns:1fr} .detail-cols{grid-template-columns:1fr} }
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed; z-index:60; width:260px; transform:translateX(-100%); transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:inline-flex}
  .content{padding:18px 16px 60px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">OPH</div><div><h1>Gestion Locative</h1><span>Office de l'Habitat · PF</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <a class="btn ghost sm" href="../">← Portail</a>
      <select id="sessRole" title="Profil de test">
        <option value="gestion">Gestion locative</option>
        <option value="locataire">Locataire</option>
        <option value="demandeur">Demandeur</option>
      </select>
      <select id="sessId" title="Compte simulé"></select>
    </div>
  </aside>
  <div class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <div><h2 id="pageTitle">Tableau de bord</h2><div class="sub" id="pageSub"></div></div>
      <div class="spacer"></div>
      <div id="pageActions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script src="../ged/ged-core.js"></script>
<script src="../ged/ged-ui.js"></script>
<script>
"use strict";
const KEY = "oph_logement_v1";
const SESSION_KEY = KEY + "_session";

/* ---------- Icônes ---------- */
const I = {
  dash:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/><path d="M10 19v-5h4v5"/>',
  users:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 20a5 5 0 0 0-3-4.6"/>',
  file:'<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h5"/>',
  cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 6v0M18 18v0"/>',
  key:'<circle cx="8" cy="15" r="3.5"/><path d="M10.5 12.5 19 4l2 2-2 2 2 2-3 3-2-2-2 2"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L2 19l3 3 7.3-7.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.8-.8-.8-2.8z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  eye:'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>',
  back:'<path d="M19 12H5M11 18l-6-6 6-6"/>',
  star:'<path d="M12 3l2.6 5.6 6.1.6-4.6 4.1 1.3 6-5.4-3.2-5.4 3.2 1.3-6L3.3 9.2l6.1-.6z"/>'
};
function svg(d, cls){ return `<svg class="${cls||'ic'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function uid(p){ return p+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowStamp(){ const d=new Date(); return d.toLocaleDateString("fr-FR")+" "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}); }
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return d&&m&&y?`${d}/${m}/${y}`:iso; }
function fmtMoney(n){ return (Math.round(Number(n)||0)).toLocaleString("fr-FR")+" XPF"; }
function initials(nom,prenom){ return ((prenom||"")[0]||"")+((nom||"")[0]||""); }
function badge(s){
  const tone = {"Vacant":"info","Occupé":"ok","Travaux":"warn",
    "Déposée":"info","Instruction":"info","Éligible":"ok","Proposée":"warn","Attribuée":"ok","Refusée":"bad","Radiée":"mut",
    "Actif":"ok","Préavis":"warn","Résilié":"mut",
    "À émettre":"info","Émise":"info","Payée":"ok","Impayée":"bad",
    "Signalée":"warn","Planifiée":"info","Réalisée":"ok",
    "En réhabilitation":"warn","En cours":"info","Terminée":"ok"}[s] || "mut";
  return `<span class="badge ${tone}">${esc(s||"—")}</span>`;
}
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2400); }

const COMMUNES = ["Papeete","Faa'a","Pirae","Punaauia","Mahina","Arue","Paea","Papara"];
const TYPES_LOGEMENT = ["T1","T2","T3","T4","T5"];
const TYPES_STATIONNEMENT = ["Garage","Place de parking"];

/* ---------- Données de démonstration ---------- */
function seed(){
  const lotissements = [
    {nom:"Manutahi", commune:"Papeete", statut:"Actif"},
    {nom:"Teavaraa", commune:"Faa'a", statut:"Actif"},
    {nom:"Ariiheue", commune:"Pirae", statut:"En réhabilitation"},
    {nom:"Punavai", commune:"Punaauia", statut:"Actif"}
  ].map(l=>({id:uid("lt_"), ...l}));
  const ltid = n => lotissements[n].id;

  const logements = [
    {lotissementId:ltid(0), categorie:"Logement", numero:"A101", adresse:"Rue du Commandant Destremau", direction:"Papeete", type:"T2", surface:45, etage:"1", loyerBase:65000, chargesBase:8000, statut:"Occupé"},
    {lotissementId:ltid(0), categorie:"Logement", numero:"A102", adresse:"Rue du Commandant Destremau", direction:"Papeete", type:"T3", surface:62, etage:"1", loyerBase:82000, chargesBase:10000, statut:"Occupé"},
    {lotissementId:ltid(0), categorie:"Logement", numero:"A203", adresse:"Rue du Commandant Destremau", direction:"Papeete", type:"T2", surface:45, etage:"2", loyerBase:65000, chargesBase:8000, statut:"Vacant"},

function migrate(db){
  if(!db.lotissements) db.lotissements=[];
  if(!db.logements) db.logements=[];
  if(!db.locataires) db.locataires=[];
  if(!db.baux) db.baux=[];
  if(!db.quittances) db.quittances=[];
  if(!db.demandeurs) db.demandeurs=[];
  if(!db.interventions) db.interventions=[];
  if(!db.rehabilitations) db.rehabilitations=[];
  return db;
}
let DB = null;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ console.warn("save",e); } }
function load(){
  try{ const raw=localStorage.getItem(KEY); if(raw){ DB=migrate(JSON.parse(raw)); return; } }catch(e){}
  DB = seed(); save();
}

function renderSessionBar(){
  const roleSel=document.getElementById("sessRole"), idSel=document.getElementById("sessId");
  roleSel.value=SESSION.role;
  const list = SESSION.role==="locataire" ? DB.locataires.map(l=>({v:l.id,l:`${l.prenom} ${l.nom}`}))
    : SESSION.role==="demandeur" ? DB.demandeurs.map(d=>({v:d.id,l:`${d.prenom} ${d.nom}`}))
    : [];
  idSel.innerHTML = list.map(o=>`<option value="${o.v}">${esc(o.l)}</option>`).join("");
  idSel.style.display = list.length ? "" : "none";
  if(list.length && !list.some(o=>o.v===SESSION.asId)) SESSION.asId=list[0].v;
  idSel.value = SESSION.asId||"";
  roleSel.onchange=()=>{ SESSION.role=roleSel.value; SESSION.asId=null; saveSession(); renderSessionBar(); go(roleHome()); };
  idSel.onchange=()=>{ SESSION.asId=idSel.value; saveSession(); render(); };

function renderNav(){
  const items = ROLE_NAV[SESSION.role]||NAV_GESTION;
  let html="", lastGroup="__";
  items.forEach(n=>{
    if(n.group!==lastGroup){ if(n.group) html+=`<div class="nav-group">${n.group}</div>`; lastGroup=n.group; }
    const active = view.module===n.id?"active":"";
    let cnt="";
    if(n.id==="demandeurs"){ const c=DB.demandeurs.filter(d=>d.statut==="Déposée"||d.statut==="Instruction").length; if(c) cnt=`<span class="count">${c}</span>`; }
    if(n.id==="quittances"){ const c=DB.quittances.filter(q=>q.statut==="Impayée").length; if(c) cnt=`<span class="count">${c}</span>`; }
    if(n.id==="interventions"){ const c=DB.interventions.filter(i=>i.statut!=="Réalisée").length; if(c) cnt=`<span class="count">${c}</span>`; }
    if(n.id==="rehabilitations"){ const c=DB.rehabilitations.filter(r=>r.statut==="En cours").length; if(c) cnt=`<span class="count">${c}</span>`; }
    html+=`<a data-nav="${n.id}" class="${active}">${svg(n.icon)}<span>${esc(n.label)}</span>${cnt}</a>`;
  });
  document.getElementById("nav").innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.onclick=()=>{ go(a.dataset.nav); closeSidebar(); });
}

function filterRows(rows){
  let r=rows;
  if(view.search) r=r.filter(x=>(x._search||"").toLowerCase().includes(view.search.toLowerCase()));
  if(view.filter) r=r.filter(x=>x._filterVal===view.filter);
  return r;
}
function toolbar(filterKey, options){
  return `<div class="toolbar">
    <div class="search">${svg(I.eye,'ic')}<input id="searchInp" placeholder="Rechercher…" value="${esc(view.search)}"></div>
    ${options?`<select class="filter-sel" id="filterSel"><option value="">Tous — ${esc(filterKey)}</option>${options.map(o=>`<option value="${esc(o)}" ${view.filter===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`:""}

  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th${c.num?' style="text-align:right"':""}>${esc(c.h)}</th>`).join("")}</tr></thead><tbody>${body||`<tr><td colspan="${cols.length}"><div class="empty">Aucun résultat.</div></td></tr>`}</tbody></table></div>`;
}
function wireToolbar(renderFn, bindFn){
  const rerender=()=>{ document.getElementById("content").innerHTML=renderFn(); wireToolbar(renderFn, bindFn); if(bindFn) bindFn(); };
  const si=document.getElementById("searchInp"); if(si) si.oninput=()=>{ view.search=si.value; rerender(); };
  const fs=document.getElementById("filterSel"); if(fs) fs.onchange=()=>{ view.filter=fs.value; rerender(); };
}

    const disabled=(f.k==="locataireId"||f.k==="logementId"||f.k==="bailId") && preset[f.k] ? "disabled":"";
    if(f.t==="select"){
      input=`<select data-k="${f.k}" ${disabled}>${f.o.map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else if(f.t==="ref"){
      const items=DB[f.coll]||[];
      input=`<select data-k="${f.k}" ${disabled}><option value="">—</option>${items.map(it=>`<option value="${it.id}" ${val===it.id?"selected":""}>${esc(f.labelFn(it))}</option>`).join("")}</select>`;
    } else if(f.t==="textarea"){
      input=`<textarea data-k="${f.k}">${esc(val||"")}</textarea>`;
    } else {
      input=`<input data-k="${f.k}" type="${f.t}" value="${esc(val==null?"":val)}">`;
    }
    return `<div class="field ${f.full?"full":""}"><label>${esc(f.l)}${req}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
  };
  const mr=document.getElementById("modalRoot");
  mr.innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>${isEdit?"Modifier":"Nouveau"} ${esc(cfg.title)}</h3><div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button></div>
    <div class="modal-body"><div class="form-grid">${cfg.fields.map(fieldHTML).join("")}</div></div>
    <div class="modal-foot"><button class="btn" id="cancelModal">Annuler</button><button class="btn primary" id="saveModal">${svg(I.check,'ic')} Enregistrer</button></div>
  </div></div>`;
  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;
  document.getElementById("cancelModal").onclick=close;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };
  document.getElementById("saveModal").onclick=()=>{
    const data={...rec};
    let missing=null;
    cfg.fields.forEach(f=>{
      if(f.s || (f.hideSelf&&opts.selfService)) return;
      const el=mr.querySelector(`[data-k="${f.k}"]`);
      if(!el) return;
      let v=el.value;
      if(f.t==="number") v=v===""?0:Number(v);
      if(f.req && (v===""||v==null)) missing=f.l;
      data[f.k]=v;
    });
    if(missing){ toast(`Champ requis : ${missing}`); return; }
    if(cfg.compute) Object.assign(data, cfg.compute(data));
    if(isEdit){ Object.assign(coll.find(x=>x.id===id), data); }
    else { data.id=uid(module.slice(0,2)+"_"); Object.assign(data, preset); coll.push(data); }
    save(); close(); toast("Enregistrement créé"); render();
  };
}
function delRecord(module, id){
  if(!confirm("Supprimer cet enregistrement ?")) return;
  DB[module]=DB[module].filter(x=>x.id!==id);
  save(); toast("Supprimé"); render();
}

function pushHistorique(d, action, commentaire){ if(!d.historique) d.historique=[]; d.historique.push({action, date:nowStamp(), commentaire:commentaire||""}); }
function openDemandeurDetail(id){
  const d=DB.demandeurs.find(x=>x.id===id); if(!d) return;
  const actionsByStatut = {
    "Déposée": [{l:"Passer en instruction", to:"Instruction"}],
    "Instruction": [{l:"Marquer éligible", to:"Éligible"},{l:"Refuser", to:"Refusée", danger:true}],
    "Éligible": [{l:"Proposer un logement", action:"propose"},{l:"Refuser", to:"Refusée", danger:true}],
    "Proposée": [{l:"Confirmer l'attribution", action:"attribuer"},{l:"Refuser la proposition", to:"Éligible"}],
    "Attribuée": [], "Refusée": [{l:"Radier", to:"Radiée"}], "Radiée": []
  };
  const actions=(actionsByStatut[d.statut]||[]).map(a=>`<button class="btn ${a.danger?'danger':'primary'} sm" data-act="${a.action||a.to}">${esc(a.l)}</button>`).join(" ");
  const histHtml=(d.historique||[]).slice().reverse().map(h=>`<div class="wf-item"><div class="wf-dot"></div><div class="wf-body"><div class="wf-top"><strong>${esc(h.action)}</strong><span class="wf-date">${esc(h.date)}</span></div>${h.commentaire?`<div class="wf-comment">${esc(h.commentaire)}</div>`:""}</div></div>`).join("");

    <div class="modal-head"><h3>${esc(d.civ)} ${esc(d.prenom)} ${esc(d.nom)}</h3><div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button></div>

        <div class="row"><span class="l">Ressources mensuelles</span><span class="v">${fmtMoney(d.ressourcesMensuelles)}</span></div>
        <div class="row"><span class="l">Adresse actuelle</span><span class="v">${esc(d.adresseActuelle||"—")}</span></div>
        <div class="row"><span class="l">Souhait</span><span class="v">${esc(d.typeSouhaite)} · ${esc(d.zoneSouhaitee)}</span></div>
        <div class="row"><span class="l">Téléphone</span><span class="v">${esc(d.tel||"—")}</span></div>
        <div class="row"><span class="l">Email</span><span class="v">${esc(d.email||"—")}</span></div>
        ${d.commentaire?`<div class="row"><span class="l">Commentaire</span><span class="v">${esc(d.commentaire)}</span></div>`:""}
      </div>
      <div style="margin-top:14px">${actions}</div>
      <h4 style="margin:18px 0 8px;font-size:13px;color:var(--ink-3);text-transform:uppercase">Historique</h4>
      ${histHtml||'<div class="empty">Aucun historique.</div>'}
    </div>
    <div class="modal-foot"><button class="btn" id="cancelModal">Fermer</button></div>
  </div></div>`;
  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;

  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };

    const act=btn.dataset.act;
    if(act==="propose"){ close(); openProposerLogement(d.id); return; }
    if(act==="attribuer"){ close(); attribuerLogement(d.id); return; }
    d.statut=act; pushHistorique(d, `Statut → ${act}`);
    save(); close(); toast(`Statut mis à jour : ${act}`); render();
  });

function openProposerLogement(demandeurId){
  const d=DB.demandeurs.find(x=>x.id===demandeurId);
  const vacants=DB.logements.filter(l=>l.statut==="Vacant" && (l.categorie||"Logement")==="Logement");
  const mr=document.getElementById("modalRoot");
  mr.innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>Proposer un logement</h3><div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button></div>
    <div class="modal-body"><div class="field"><label>Logement vacant</label><select id="logSelect">${vacants.length?vacants.map(l=>`<option value="${l.id}">${esc(lotissementName(l.lotissementId))} ${esc(l.numero)} · ${esc(l.type)} · ${esc(l.direction)}</option>`).join(""):'<option value="">Aucun logement vacant</option>'}</select></div></div>
    <div class="modal-foot"><button class="btn" id="cancelModal">Annuler</button><button class="btn primary" id="okBtn" ${vacants.length?"":"disabled"}>Proposer</button></div>
  </div></div>`;
  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;
  document.getElementById("cancelModal").onclick=close;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };
  document.getElementById("okBtn").onclick=()=>{
    const logId=document.getElementById("logSelect").value;
    d.statut="Proposée"; d.logementProposeId=logId;
    pushHistorique(d, "Logement proposé", logementLabel(logId));
    save(); close(); toast("Logement proposé au demandeur"); render();
  };
}
function attribuerLogement(demandeurId){
  const d=DB.demandeurs.find(x=>x.id===demandeurId);
  const logement=DB.logements.find(l=>l.id===d.logementProposeId);
  if(!logement){ toast("Logement proposé introuvable"); return; }
  const locataire={ id:uid("lo_"), civ:d.civ, nom:d.nom, prenom:d.prenom, dateNaissance:d.dateNaissance, tel:d.tel, email:d.email };
  DB.locataires.push(locataire);
  const bail={ id:uid("bx_"), locataireId:locataire.id, logementId:logement.id, dateEffet:todayISO(), loyer:logement.loyerBase, charges:logement.chargesBase, depotGarantie:logement.loyerBase, statut:"Actif", modeOccupation:"Location", aideType:"Aucune", aideMontant:0 };
  DB.baux.push(bail);
  logement.statut="Occupé";
  d.statut="Attribuée"; d.locataireId=locataire.id;
  pushHistorique(d, "Attribution confirmée", `${logementLabel(logement.id)} — bail créé`);
  save(); toast("Logement attribué : locataire et bail créés"); render();
}

/* ---------- Locataires ---------- */
function renderLocataires(){
  let rows=DB.locataires.map(l=>({...l, _search:`${l.nom} ${l.prenom}`}));
  rows=filterRows(rows);
  const cols=[{h:"Locataire"},{h:"Logement"},{h:"Loyer + charges",num:true},{h:"Statut bail"},{h:""}];
  const body=rows.map(l=>{
    const bail=DB.baux.find(b=>b.locataireId===l.id && b.statut!=="Résilié");
    return `<tr>
      <td><div class="av" style="display:inline-flex;margin-right:8px">${esc(initials(l.nom,l.prenom))}</div><span class="cell-name">${esc(l.civ)} ${esc(l.prenom)} ${esc(l.nom)}</span><div class="cell-sub">${esc(l.tel||"—")}</div></td>
      <td>${bail?esc(logementLabel(bail.logementId)):"—"}</td>
      <td class="num">${bail?fmtMoney(bail.loyer+bail.charges):"—"}</td>
      <td>${bail?badge(bail.statut):'<span class="badge mut">Sans bail</span>'}</td>
      <td><div class="row-actions"><button class="btn ghost sm" data-edit="${l.id}" title="Modifier">${svg(I.edit,'ic')}</button><button class="btn ghost sm" data-del="${l.id}" title="Supprimer">${svg(I.trash,'ic')}</button></div></td>
    </tr>`;
  }).join("");
  return toolbar("recherche") + tableShell(cols, body);
}
function bindLocataires(){
  document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openForm("locataires", el.dataset.edit));
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>delRecord("locataires", el.dataset.del));
}

/* ---------- Baux ---------- */
function renderBaux(){
  let rows=DB.baux.map(b=>({...b, _search:`${locataireName(b.locataireId)} ${logementLabel(b.logementId)}`, _filterVal:b.statut}));
  rows=filterRows(rows);
  const cols=[{h:"Locataire"},{h:"Logement"},{h:"Effet"},{h:"Loyer + charges",num:true},{h:"Statut"},{h:""}];
  const body=rows.map(b=>`<tr>
      <td class="cell-name">${esc(locataireName(b.locataireId))}</td>
      <td>${esc(logementLabel(b.logementId))}${b.modeOccupation==="Accession à la propriété"?'<div class="cell-sub">Accession à la propriété</div>':""}</td>
      <td>${fmtDate(b.dateEffet)}</td>
      <td class="num">${fmtMoney(b.loyer+b.charges)}</td>
      <td>${badge(b.statut)}</td>
      <td><div class="row-actions">
        ${b.statut==="Actif"?`<button class="btn ghost sm" data-preavis="${b.id}" title="Mettre en préavis">${svg(I.wrench,'ic')}</button>`:""}
        ${b.statut!=="Résilié"?`<button class="btn ghost sm" data-resilie="${b.id}" title="Résilier">${svg(I.x,'ic')}</button>`:""}
        <button class="btn ghost sm" data-edit="${b.id}" title="Modifier">${svg(I.edit,'ic')}</button>
      </div></td>
    </tr>`).join("");
  return toolbar("statut", ["Actif","Préavis","Résilié"]) + tableShell(cols, body);
}
function bindBaux(){
  document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openForm("baux", el.dataset.edit));
  document.querySelectorAll("[data-preavis]").forEach(el=>el.onclick=()=>{ const b=DB.baux.find(x=>x.id===el.dataset.preavis); b.statut="Préavis"; save(); toast("Bail en préavis"); render(); });
  document.querySelectorAll("[data-resilie]").forEach(el=>el.onclick=()=>{
    const b=DB.baux.find(x=>x.id===el.dataset.resilie);
    if(!confirm("Résilier ce bail ? Le logement repassera en vacant.")) return;
    b.statut="Résilié"; b.dateResiliation=todayISO();
    const lg=DB.logements.find(l=>l.id===b.logementId); if(lg) lg.statut="Vacant";
    save(); toast("Bail résilié"); render();
  });
}

/* ---------- Quittances ---------- */
function genererQuittances(){
  const periode=todayISO().slice(0,7);
  const actifs=DB.baux.filter(b=>b.statut!=="Résilié");
  const existants=new Set(DB.quittances.filter(q=>q.periode===periode).map(q=>q.bailId));
  let n=0;
  actifs.forEach(b=>{
    if(existants.has(b.id)) return;
    const brut=b.loyer+b.charges;
    const aideDeduite = b.aideType && b.aideType!=="Aucune" ? Math.min(b.aideMontant||0, brut) : 0;
    DB.quittances.push({id:uid("qt_"), bailId:b.id, periode, loyer:b.loyer, charges:b.charges, aideDeduite, montant:brut-aideDeduite, statut:"Émise", datePaiement:null});
    n++;
  });
  save();
  if(n===0) toast("Toutes les quittances de ce mois ont déjà été générées");
  else toast(`${n} quittance(s) générée(s) pour ${periode}`);
  render();
}
function renderQuittances(){
  let rows=DB.quittances.map(q=>({...q, _search:`${locataireName(DB.baux.find(b=>b.id===q.bailId)?.locataireId)} ${q.periode}`, _filterVal:q.statut}));
  rows=filterRows(rows).sort((a,b)=>b.periode.localeCompare(a.periode));
  const cols=[{h:"Locataire"},{h:"Logement"},{h:"Période"},{h:"Montant",num:true},{h:"Statut"},{h:""}];
  const body=rows.map(q=>{ const b=DB.baux.find(x=>x.id===q.bailId); return `<tr>
      <td class="cell-name">${esc(locataireName(b?.locataireId))}</td>
      <td>${esc(logementLabel(b?.logementId))}</td>
      <td>${esc(q.periode)}</td>
      <td class="num">${fmtMoney(q.montant)}${q.aideDeduite?`<div class="cell-sub">dont ${fmtMoney(q.aideDeduite)} d'aide déduite</div>`:""}</td>
      <td>${badge(q.statut)}</td>
      <td><div class="row-actions">
        ${q.statut!=="Payée"?`<button class="btn ghost sm" data-payee="${q.id}" title="Marquer payée">${svg(I.check,'ic')}</button>`:""}
        ${q.statut==="Émise"?`<button class="btn ghost sm" data-impayee="${q.id}" title="Marquer impayée">${svg(I.x,'ic')}</button>`:""}
      </div></td>
    </tr>`;}).join("");
  return toolbar("statut", ["À émettre","Émise","Payée","Impayée"]) + tableShell(cols, body);
}
function bindQuittances(){
  document.querySelectorAll("[data-payee]").forEach(el=>el.onclick=()=>{ const q=DB.quittances.find(x=>x.id===el.dataset.payee); q.statut="Payée"; q.datePaiement=todayISO(); save(); toast("Quittance marquée payée"); render(); });
  document.querySelectorAll("[data-impayee]").forEach(el=>el.onclick=()=>{ const q=DB.quittances.find(x=>x.id===el.dataset.impayee); q.statut="Impayée"; save(); toast("Quittance marquée impayée"); render(); });
}

/* ---------- Interventions ---------- */
function renderInterventions(){
  let rows=DB.interventions.map(i=>({...i, _search:`${i.type} ${logementLabel(i.logementId)} ${locataireName(DB.baux.find(b=>b.id===i.bailId)?.locataireId)}`, _filterVal:i.statut}));
  rows=filterRows(rows).sort((a,b)=>(b.dateDemande||"").localeCompare(a.dateDemande||""));
  const cols=[{h:"Logement"},{h:"Locataire"},{h:"Type"},{h:"Signalée le"},{h:"Statut"},{h:""}];
  const body=rows.map(i=>{ const b=DB.baux.find(x=>x.id===i.bailId); return `<tr>
      <td class="cell-name">${esc(logementLabel(i.logementId))}</td>
      <td>${b?esc(locataireName(b.locataireId)):'<span class="badge mut">Partie commune / vacant</span>'}</td>
      <td>${esc(i.type)}<div class="cell-sub">${esc(i.description)}</div></td>
      <td>${fmtDate(i.dateDemande)}</td>
      <td>${badge(i.statut)}</td>
      <td><div class="row-actions">
        ${i.statut==="Signalée"?`<button class="btn ghost sm" data-planifie="${i.id}" title="Planifier">${svg(I.eye,'ic')}</button>`:""}
        ${i.statut!=="Réalisée"?`<button class="btn ghost sm" data-realise="${i.id}" title="Marquer réalisée">${svg(I.check,'ic')}</button>`:""}
      </div></td>
    </tr>`;}).join("");
  return toolbar("statut", ["Signalée","Planifiée","Réalisée"]) + tableShell(cols, body);
}
function bindInterventions(){
  document.querySelectorAll("[data-planifie]").forEach(el=>el.onclick=()=>{ const i=DB.interventions.find(x=>x.id===el.dataset.planifie); i.statut="Planifiée"; save(); toast("Intervention planifiée"); render(); });
  document.querySelectorAll("[data-realise]").forEach(el=>el.onclick=()=>{ const i=DB.interventions.find(x=>x.id===el.dataset.realise); i.statut="Réalisée"; save(); toast("Intervention marquée réalisée"); render(); });
}

/* ---------- Self-service Locataire ---------- */
function renderMonEspaceLocataire(){
  const l=currentLocataire(); if(!l) return `<div class="empty">Profil introuvable.</div>`;
  const bail=DB.baux.find(b=>b.locataireId===l.id && b.statut!=="Résilié");
  const mesQuittances=DB.quittances.filter(q=>bail && q.bailId===bail.id).sort((a,b)=>b.periode.localeCompare(a.periode));
  const impayees=mesQuittances.filter(q=>q.statut==="Impayée");
  const mesInterventions=DB.interventions.filter(i=>bail && i.bailId===bail.id);
  return `
    <div class="detail-head">
      <div class="av">${esc(initials(l.nom,l.prenom))}</div>
      <div style="flex:1"><h2>${esc(l.civ)} ${esc(l.prenom)} ${esc(l.nom)}</h2><div class="meta">${bail?esc(logementLabel(bail.logementId)):"Aucun bail actif"}</div></div>
    </div>
    <div class="kpi-grid">
      <div class="kpi" data-goto="mon-bail"><div class="k-lbl">Loyer + charges</div><div class="k-val" style="font-size:22px">${bail?fmtMoney(bail.loyer+bail.charges):"—"}</div></div>
      <div class="kpi" data-goto="mes-quittances"><div class="k-lbl">Impayés</div><div class="k-val">${impayees.length}</div><div class="k-meta ${impayees.length?'bad':'ok'}">${impayees.length?fmtMoney(impayees.reduce((s,q)=>s+q.montant,0)):"À jour"}</div></div>
      <div class="kpi" data-goto="mes-interventions"><div class="k-lbl">Interventions en cours</div><div class="k-val">${mesInterventions.filter(i=>i.statut!=="Réalisée").length}</div></div>
    </div>
    <div class="panels">
      <div class="panel"><div class="panel-head"><h3>Mes dernières quittances</h3></div><div class="panel-body">${mesQuittances.slice(0,5).map(q=>`<div class="mini-row"><div><div class="who">${esc(q.periode)}</div><div class="det">${fmtMoney(q.montant)}</div></div><div class="spacer"></div>${badge(q.statut)}</div>`).join("")||'<div class="empty">Aucune quittance.</div>'}</div></div>
      <div class="panel"><div class="panel-head"><h3>Raccourcis</h3></div><div class="panel-body" style="padding:14px 18px;display:flex;flex-direction:column;gap:10px"><button class="btn" data-goto="mon-bail">${svg(I.file,'ic')} Consulter mon bail</button><button class="btn primary" data-goto="mes-interventions">${svg(I.wrench,'ic')} Signaler un problème</button></div></div>
    </div>`;
}
function bindMonEspaceLocataire(){ document.querySelectorAll("[data-goto]").forEach(el=>el.onclick=()=>go(el.dataset.goto)); }
function renderMonBail(){

  const logement=DB.logements.find(x=>x.id===bail.logementId);
  const loyerLabel = bail.modeOccupation==="Accession à la propriété" ? "Mensualité" : "Loyer";
  return `<div class="detail-cols"><div class="panel"><div class="panel-head"><h3>Logement</h3></div><div class="panel-body"><div class="info-list">
      <div class="row"><span class="l">Lotissement</span><span class="v">${esc(lotissementName(logement.lotissementId))}</span></div>
      <div class="row"><span class="l">Porte</span><span class="v">${esc(logement.numero)}</span></div>
      <div class="row"><span class="l">Adresse</span><span class="v">${esc(logement.adresse)}, ${esc(logement.direction)}</span></div>
      <div class="row"><span class="l">Type / surface</span><span class="v">${esc(logement.type)} · ${esc(logement.surface)} m²</span></div>
    </div></div></div>
    <div class="panel"><div class="panel-head"><h3>Contrat</h3></div><div class="panel-body"><div class="info-list">
      <div class="row"><span class="l">Statut</span><span class="v">${badge(bail.statut)}</span></div>
      <div class="row"><span class="l">Mode d'occupation</span><span class="v">${esc(bail.modeOccupation||"Location")}</span></div>
      <div class="row"><span class="l">Date d'effet</span><span class="v">${fmtDate(bail.dateEffet)}</span></div>
      <div class="row"><span class="l">${esc(loyerLabel)}</span><span class="v">${fmtMoney(bail.loyer)}</span></div>
      <div class="row"><span class="l">Refacturation de charges</span><span class="v">${fmtMoney(bail.charges)}</span></div>
      <div class="row"><span class="l">Dépôt de garantie</span><span class="v">${fmtMoney(bail.depotGarantie)}</span></div>
      ${bail.aideType && bail.aideType!=="Aucune"?`<div class="row"><span class="l">Aide au logement</span><span class="v">${esc(bail.aideType)} — ${fmtMoney(bail.aideMontant)}</span></div>`:""}
      ${bail.modeOccupation==="Accession à la propriété" && bail.prixVente?`<div class="row"><span class="l">Prix de vente</span><span class="v">${fmtMoney(bail.prixVente)}</span></div>`:""}
      ${bail.dateResiliation?`<div class="row"><span class="l">Fin de préavis</span><span class="v">${fmtDate(bail.dateResiliation)}</span></div>`:""}
    </div></div></div></div>`;
}
function renderMesQuittances(){
  const l=currentLocataire(); const bail=l && DB.baux.find(b=>b.locataireId===l.id && b.statut!=="Résilié");
  const rows=(bail?DB.quittances.filter(q=>q.bailId===bail.id):[]).sort((a,b)=>b.periode.localeCompare(a.periode));
  const cols=[{h:"Période"},{h:"Montant",num:true},{h:"Statut"},{h:"Date de paiement"}];
  const body=rows.map(q=>`<tr><td class="cell-name">${esc(q.periode)}</td><td class="num">${fmtMoney(q.montant)}${q.aideDeduite?`<div class="cell-sub">dont ${fmtMoney(q.aideDeduite)} d'aide déduite</div>`:""}</td><td>${badge(q.statut)}</td><td>${q.datePaiement?fmtDate(q.datePaiement):"—"}</td></tr>`).join("");
  return tableShell(cols, body);

function renderMesInterventions(){
  const l=currentLocataire(); const bail=l && DB.baux.find(b=>b.locataireId===l.id && b.statut!=="Résilié");
  const rows=(bail?DB.interventions.filter(i=>i.bailId===bail.id):[]).sort((a,b)=>(b.dateDemande||"").localeCompare(a.dateDemande||""));
  const cols=[{h:"Type"},{h:"Description"},{h:"Signalée le"},{h:"Statut"}];
  const body=rows.map(i=>`<tr><td class="cell-name">${esc(i.type)}</td><td>${esc(i.description)}</td><td>${fmtDate(i.dateDemande)}</td><td>${badge(i.statut)}</td></tr>`).join("");
  return tableShell(cols, body);
}

/* ---------- Self-service Demandeur ---------- */
function renderSuiviDemande(){
  const d=currentDemandeur(); if(!d) return `<div class="empty">Profil introuvable.</div>`;
  const etapes=["Déposée","Instruction","Éligible","Proposée","Attribuée"];
  const idx=etapes.indexOf(d.statut);
  const stepsHtml=etapes.map((e,i)=>`<div class="kpi" style="text-align:center"><div class="k-lbl">${esc(e)}</div><div class="k-val" style="font-size:16px">${idx>=i?"✓":"—"}</div></div>`).join("");
  const histHtml=(d.historique||[]).slice().reverse().map(h=>`<div class="wf-item"><div class="wf-dot"></div><div class="wf-body"><div class="wf-top"><strong>${esc(h.action)}</strong><span class="wf-date">${esc(h.date)}</span></div>${h.commentaire?`<div class="wf-comment">${esc(h.commentaire)}</div>`:""}</div></div>`).join("");
  return `<div class="detail-head"><div class="av">${esc(initials(d.nom,d.prenom))}</div><div><h2>${esc(d.civ)} ${esc(d.prenom)} ${esc(d.nom)}</h2><div class="meta">Dossier déposé le ${fmtDate(d.dateDepot)} · ${badge(d.statut)}</div></div></div>
    ${d.statut!=="Refusée"&&d.statut!=="Radiée"?`<div class="kpi-grid">${stepsHtml}</div>`:`<div class="panel"><div class="panel-body"><p style="padding:14px">${d.statut==="Refusée"?"Votre demande a été refusée.":"Votre dossier a été radié."} ${esc(d.commentaire||"")}</p></div></div>`}
    <div class="panel"><div class="panel-head"><h3>Historique de mon dossier</h3></div><div class="panel-body" style="padding:14px 18px">${histHtml||'<div class="empty">Aucun historique.</div>'}</div></div>`;
}

document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("modalRoot").innerHTML=""; });

load();

loadSession();

if(hashModule && ROLE_MODULES[SESSION.role] && ROLE_MODULES[SESSION.role].includes(hashModule)) view.module=hashModule;
