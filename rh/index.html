<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPH · Gestion RH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
:root{
  --font: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --ink: #12211f;
  --ink-2: #4a5b58;
  --ink-3: #7a8a87;
  --bg: #eef1f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --border: #d7dddb;
  --border-strong: #c2cac8;
  --primary: #0f6e6a;
  --primary-dark: #0a504d;
  --primary-soft: #e2efee;
  --primary-ink: #ffffff;
  --ok: #2f8f5b; --ok-bg:#e6f4ec;
  --warn: #b57812; --warn-bg:#fbf1dd;
  --bad: #c0453b; --bad-bg:#f9e6e4;
  --info:#2f6f9f; --info-bg:#e5eef6;
  --shadow: 0 1px 2px rgba(18,33,31,.06), 0 8px 24px rgba(18,33,31,.05);
  --radius: 10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e8efed; --ink-2:#a9b8b5; --ink-3:#7d8d8a;
    --bg:#0c1413; --surface:#131e1c; --surface-2:#0f1817;
    --border:#243230; --border-strong:#334340;
    --primary:#3aa39c; --primary-dark:#2b807a; --primary-soft:#12302e; --primary-ink:#04110f;
    --ok:#4bbd7f; --ok-bg:#123122; --warn:#d69a3c; --warn-bg:#332614; --bad:#e06b60; --bad-bg:#361c1a; --info:#5c9ecb; --info-bg:#132635;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#e8efed; --ink-2:#a9b8b5; --ink-3:#7d8d8a;
  --bg:#0c1413; --surface:#131e1c; --surface-2:#0f1817;
  --border:#243230; --border-strong:#334340;
  --primary:#3aa39c; --primary-dark:#2b807a; --primary-soft:#12302e; --primary-ink:#04110f;
  --ok:#4bbd7f; --ok-bg:#123122; --warn:#d69a3c; --warn-bg:#332614; --bad:#e06b60; --bad-bg:#361c1a; --info:#5c9ecb; --info-bg:#132635;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  font-feature-settings:"tnum" 0;
}
button{font-family:inherit}
a{color:inherit}
::selection{background:var(--primary-soft)}

/* Layout */
.app{display:grid; grid-template-columns:248px 1fr; min-height:100vh}
.sidebar{
  background:var(--surface); border-right:1px solid var(--border);
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
}
.brand{padding:20px 20px 14px; display:flex; align-items:center; gap:11px}
.brand .logo{
  width:38px;height:38px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:var(--primary-ink); display:grid; place-items:center; font-weight:800; font-size:16px;
}
.brand h1{font-size:15px; margin:0; line-height:1.15; font-weight:700}
.brand span{font-size:11.5px; color:var(--ink-3); font-weight:500}
.nav{padding:8px; overflow-y:auto; flex:1}
.nav-group{font-size:10.5px; letter-spacing:.06em; color:var(--ink-3); font-weight:700; padding:14px 12px 6px; text-transform:uppercase}
.nav a{
  display:flex; align-items:center; gap:11px; padding:9px 12px; border-radius:8px;
  color:var(--ink-2); text-decoration:none; font-weight:500; font-size:14px; cursor:pointer;
  position:relative;
}
.nav a .ic{width:18px;height:18px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.9}
.nav a:hover{background:var(--surface-2); color:var(--ink)}
.nav a.active{background:var(--primary-soft); color:var(--primary-dark); font-weight:600}
.nav a .count{margin-left:auto; background:var(--warn-bg); color:var(--warn); font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px}
.sidebar-foot{padding:12px; border-top:1px solid var(--border); display:flex; gap:8px; align-items:center}
.theme-btn{background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2); border-radius:8px; padding:7px 9px; cursor:pointer; font-size:12.5px; display:flex; gap:6px; align-items:center}
.theme-btn:hover{color:var(--ink)}

.main{min-width:0; display:flex; flex-direction:column}
.topbar{
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:16px 28px; display:flex; align-items:center; gap:16px; position:sticky; top:0; z-index:5;
}
.topbar h2{margin:0; font-size:19px; font-weight:700}
.topbar .sub{color:var(--ink-3); font-size:13px; margin-top:1px}
.topbar .spacer{flex:1}
.menu-toggle{display:none; background:none; border:1px solid var(--border); border-radius:8px; padding:8px; cursor:pointer; color:var(--ink)}
.content{padding:24px 28px 60px; max-width:1280px; width:100%}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; border-radius:8px; border:1px solid transparent;
  padding:9px 15px; font-size:13.5px; font-weight:600; cursor:pointer; background:var(--surface-2);
  color:var(--ink); border-color:var(--border); transition:filter .12s, background .12s;
}
.btn:hover{background:var(--bg)}
.btn.primary{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2); padding:7px 9px}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:6px 11px; font-size:12.5px}
.btn.danger{color:var(--bad); border-color:var(--border)}
.btn.danger:hover{background:var(--bad-bg)}
.btn .ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}

/* KPI cards */
.kpi-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; margin-bottom:22px}
.kpi{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px 18px; box-shadow:var(--shadow); cursor:pointer; transition:border-color .12s, transform .08s;
}
.kpi:hover{border-color:var(--border-strong)}
.kpi:active{transform:translateY(1px)}
.kpi .k-lbl{font-size:12.5px; color:var(--ink-3); font-weight:600}
.kpi .k-val{font-size:30px; font-weight:800; margin-top:6px; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.kpi .k-meta{font-size:12px; margin-top:4px; font-weight:600}
.kpi .k-meta.ok{color:var(--ok)} .kpi .k-meta.warn{color:var(--warn)} .kpi .k-meta.bad{color:var(--bad)} .kpi .k-meta.mut{color:var(--ink-3)}

.panels{display:grid; grid-template-columns:1.4fr 1fr; gap:16px}
.panel{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
.panel-head{padding:14px 18px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:10px}
.panel-head h3{margin:0; font-size:14.5px; font-weight:700}
.panel-head .spacer{flex:1}
.panel-body{padding:6px 6px}
.mini-row{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:8px}
.mini-row:hover{background:var(--surface-2)}
.mini-row .who{font-weight:600; font-size:13.5px}
.mini-row .det{font-size:12.5px; color:var(--ink-3)}
.mini-row .spacer{flex:1}
.empty{padding:26px 16px; text-align:center; color:var(--ink-3); font-size:13.5px}

/* Toolbar + table */
.toolbar{display:flex; gap:10px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
.search{position:relative; flex:1; min-width:200px; max-width:360px}
.search input{width:100%; padding:9px 12px 9px 34px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13.5px}
.search .ic{position:absolute; left:10px; top:50%; transform:translateY(-50%); width:16px;height:16px; stroke:var(--ink-3); fill:none; stroke-width:2}
.filter-sel{padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13.5px}
input:focus, select:focus, textarea:focus, .btn:focus-visible, .kpi:focus-visible, a:focus-visible{outline:2px solid var(--primary); outline-offset:1px}

.table-wrap{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13.5px}
thead th{
  text-align:left; padding:11px 14px; font-size:11.5px; letter-spacing:.02em; color:var(--ink-3);
  font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; background:var(--surface-2);
}
tbody td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.cell-name{font-weight:600}
.cell-sub{font-size:12px; color:var(--ink-3)}
.row-actions{display:flex; gap:4px; justify-content:flex-end; white-space:nowrap}

/* Avatar */
.av{width:32px;height:32px;border-radius:50%; background:var(--primary-soft); color:var(--primary-dark); display:grid; place-items:center; font-weight:700; font-size:12px; flex:0 0 auto}
.name-cell{display:flex; align-items:center; gap:10px}

/* Badges */
.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap}
.badge::before{content:""; width:6px;height:6px;border-radius:50%; background:currentColor}
.badge.ok{background:var(--ok-bg); color:var(--ok)}
.badge.warn{background:var(--warn-bg); color:var(--warn)}
.badge.bad{background:var(--bad-bg); color:var(--bad)}
.badge.info{background:var(--info-bg); color:var(--info)}
.badge.mut{background:var(--surface-2); color:var(--ink-3)}
.tag{display:inline-block; font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border); color:var(--ink-2)}

/* Modal */
.overlay{position:fixed; inset:0; background:rgba(10,20,19,.5); backdrop-filter:blur(2px); display:grid; place-items:center; padding:20px; z-index:50}
.modal{background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; max-width:660px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px}
.modal-head h3{margin:0; font-size:17px; font-weight:700}
.modal-head .spacer{flex:1}
.modal-body{padding:20px 22px; overflow-y:auto}
.modal-foot{padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; justify-content:flex-end}
.close-x{background:none;border:none;cursor:pointer;color:var(--ink-3);padding:4px;border-radius:6px}
.close-x:hover{background:var(--surface-2); color:var(--ink)}
.close-x .ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}

/* Form */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px 16px}
.field{display:flex; flex-direction:column; gap:5px}
.field.full{grid-column:1 / -1}
.field label{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.field label .req{color:var(--bad)}
.field input, .field select, .field textarea{
  padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface);
  color:var(--ink); font-size:14px; width:100%;
}
.field textarea{resize:vertical; min-height:64px}
.field .hint{font-size:11.5px; color:var(--ink-3)}
.form-section{font-size:12px; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); font-weight:700; grid-column:1/-1; margin-top:6px; padding-bottom:2px; border-bottom:1px solid var(--border)}

/* Detail view */
.detail-head{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:20px 22px; box-shadow:var(--shadow); margin-bottom:16px}
.detail-head .av{width:56px;height:56px;font-size:20px}
.detail-head h2{margin:0; font-size:21px}
.detail-head .meta{color:var(--ink-3); font-size:13.5px; margin-top:3px; display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.detail-cols{display:grid; grid-template-columns:300px 1fr; gap:16px; align-items:start}
.info-list{display:flex; flex-direction:column}
.info-list .row{display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13.5px}
.info-list .row:last-child{border-bottom:none}
.info-list .row .l{color:var(--ink-3)}
.info-list .row .v{font-weight:600; text-align:right}
.tabs{display:flex; gap:4px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:5px; margin-bottom:14px; overflow-x:auto}
.tabs button{border:none; background:none; padding:8px 13px; border-radius:7px; font-weight:600; font-size:13px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.tabs button.active{background:var(--primary-soft); color:var(--primary-dark)}
.tabs button:hover:not(.active){background:var(--surface-2)}

.progress{height:7px; background:var(--surface-2); border-radius:20px; overflow:hidden; margin-top:8px}
.progress>i{display:block; height:100%; background:var(--primary); border-radius:20px}
.bar-legend{display:flex; flex-wrap:wrap; gap:8px 16px; padding:10px 14px}
.bar-legend .li{display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2)}
.bar-legend .dot{width:9px;height:9px;border-radius:3px}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:9px; font-size:13.5px; font-weight:600; box-shadow:0 8px 30px rgba(0,0,0,.3); z-index:80; opacity:0; transition:opacity .2s, transform .2s}
.toast.show{opacity:1}

/* Teams (conversation simulée) */
.teams-thread{display:flex; flex-direction:column; gap:10px; min-height:60px}
.teams-msg{display:flex}
.teams-msg.out{justify-content:flex-end}
.teams-bubble{max-width:80%; background:var(--primary-soft); color:var(--ink); border-radius:12px 12px 2px 12px; padding:10px 13px}
.teams-from{font-size:11px; font-weight:700; color:var(--primary-dark); margin-bottom:2px}
.teams-text{font-size:13.5px; white-space:pre-line}
.teams-time{font-size:10.5px; color:var(--ink-3); margin-top:5px; text-align:right}
#teamsMsg{width:100%; min-height:70px; padding:9px 11px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-family:inherit; font-size:13.5px; resize:vertical}

/* Historique de workflow */
.wf-timeline{display:flex; flex-direction:column; gap:16px; position:relative; padding-left:4px}
.wf-item{display:flex; gap:12px; position:relative}
.wf-item:not(:last-child)::before{content:""; position:absolute; left:4px; top:16px; bottom:-16px; width:1px; background:var(--border)}
.wf-dot{width:9px;height:9px;border-radius:50%; background:var(--primary); margin-top:5px; flex:0 0 auto}
.wf-body{flex:1}
.wf-top{display:flex; justify-content:space-between; gap:10px; font-size:13.5px}
.wf-date{color:var(--ink-3); font-size:12px; white-space:nowrap}
.wf-actor{font-size:12.5px; color:var(--ink-2); margin-top:2px}
.wf-comment{font-size:12.5px; color:var(--ink-3); margin-top:4px; font-style:italic}

/* Fiche famille */
.child-row{display:grid; grid-template-columns:1fr 1fr 1fr auto; gap:8px; margin-bottom:8px; align-items:center}
.child-row input{padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:13px}

/* Profil de test (simulateur de droits) */
.session-bar{padding:12px 14px; border-top:1px solid var(--border); display:flex; flex-direction:column; gap:6px}
.session-bar .lbl{font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-3); font-weight:700}
.session-bar select{padding:7px 9px; border:1px solid var(--border); border-radius:8px; background:var(--surface); color:var(--ink); font-size:12.5px; width:100%}

/* Arborescence de documents */
.doc-tree{display:flex; flex-direction:column; gap:8px}
.doc-cat{border:1px solid var(--border); border-radius:10px; overflow:hidden}
.doc-cat-head{display:flex; align-items:center; gap:10px; width:100%; padding:11px 14px; background:var(--surface-2); border:none; cursor:pointer; font-weight:600; font-size:13.5px; color:var(--ink); text-align:left}
.doc-cat-head:hover{background:var(--bg)}
.doc-cat-head .chev{width:14px; height:14px; stroke:var(--ink-3); transition:transform .15s; flex:0 0 auto}
.doc-cat-head.open .chev{transform:rotate(90deg)}
.doc-cat-head .tag{margin-left:auto}
.doc-cat-body{padding:4px 14px}
.doc-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border)}
.doc-row:last-child{border-bottom:none}
.doc-year{padding:6px 0}
.doc-year-lbl{font-size:12px; font-weight:700; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em; padding:8px 0 4px; display:flex; align-items:center; gap:8px}

/* Responsive */
@media (max-width:960px){ .panels{grid-template-columns:1fr} .detail-cols{grid-template-columns:1fr} }
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed; z-index:60; width:260px; transform:translateX(-100%); transition:transform .2s}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:inline-flex}
  .content{padding:18px 16px 60px}
  .topbar{padding:14px 16px}
  .form-grid{grid-template-columns:1fr}
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:55}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">OPH</div>
      <div>
        <h1>Gestion RH</h1>
        <span>Office de l'Habitat · PF</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="session-bar">
      <div class="lbl">Profil de test</div>
      <select id="sessRole">
        <option value="rh">RH (accès complet)</option>
        <option value="responsable">Responsable</option>
        <option value="df">Direction Financière</option>
        <option value="agent">Agent</option>
      </select>
      <select id="sessAgent"></select>
    </div>
    <div class="sidebar-foot">
      <button class="theme-btn" id="themeBtn" title="Changer de thème">
        <svg class="ic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        Thème
      </button>
      <button class="theme-btn" id="resetBtn" title="Réinitialiser les données de démo" style="margin-left:auto">Reset</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div>
        <h2 id="pageTitle">Tableau de bord</h2>
        <div class="sub" id="pageSub"></div>
      </div>
      <div class="spacer"></div>
      <div id="pageActions"></div>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- Icons ---------- */
const I = {
  dash:'<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 9h8V3h-8z"/>',
  agents:'<circle cx="9" cy="8" r="3.2"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 20a5 5 0 0 0-3-4.6"/>',
  conges:'<rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/><path d="M8.5 14.5l2 2 4-4"/>',

const esc = s => (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = ()=> new Date().toISOString().slice(0,10);
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split("-"); return `${d}/${m}/${y}`; }
function fmtMoney(n){ if(n==null||n==="") return "—"; return Number(n).toLocaleString("fr-FR").replace(/\u202f/g," ")+" XPF"; }
function daysBetween(a,b){ if(!a||!b) return 0; const d=(new Date(b)-new Date(a))/86400000; return d<0?0:Math.round(d)+1; }
function ancienneteLabel(entree){
  if(!entree) return "—";
  const d0=new Date(entree), d1=new Date();
  if(d1<d0) return "—";
  let years=d1.getFullYear()-d0.getFullYear(), months=d1.getMonth()-d0.getMonth();
  if(d1.getDate()<d0.getDate()) months--;
  if(months<0){ years--; months+=12; }
  const parts=[];
  if(years) parts.push(`${years} an${years>1?"s":""}`);
  if(months||!years) parts.push(`${months} mois`);
  return parts.join(" ");
}
function initials(nom,prenom){ return ((prenom||" ")[0]+(nom||" ")[0]).toUpperCase(); }

function badge(s){
  if(!s) return `<span class="badge mut">—</span>`;
  let cls="info";
  if(STATUS.ok.includes(s)) cls="ok"; else if(STATUS.warn.includes(s)) cls="warn"; else if(STATUS.bad.includes(s)) cls="bad";
  return `<span class="badge ${cls}">${esc(s)}</span>`;
}

// Filet de compatibilité pour les données déjà enregistrées en local avant l'ajout

function migrate(){
  if(!DB.carriere) DB.carriere=[];
  if(!DB.documents) DB.documents=[];
  if(!DB.paieConfig) DB.paieConfig=defaultPaieConfig();
  if(!DB.paieConfig.congesTypes) DB.paieConfig.congesTypes=defaultPaieConfig().congesTypes;
  DB.agents.forEach(a=>{
    if(a.superieurId===undefined) a.superieurId=null;
    if(!a.soldes) a.soldes={CP:a.solde??0, CPA:0, CPMF:0};
  });
  DB.conges.forEach(c=>{ if(!c.workflow) startWorkflow("conges", c); });
  save();
}

function hierarchyChain(agentId){
  const chain=[]; const seen=new Set([agentId]);
  let cur=DB.agents.find(x=>x.id===agentId);
  while(cur && cur.superieurId && !seen.has(cur.superieurId)){
    const sup=DB.agents.find(x=>x.id===cur.superieurId);
    if(!sup) break;
    chain.push(sup); seen.add(sup.id); cur=sup;
  }
  return chain;
}
function isRHAgent(agent){ return agent.direction===RH_DIRECTION && agent.actif!==false; }
// Renvoie le validateur en poste pour cet agent à une date donnée : le supérieur direct (N+1),
// à défaut le supérieur du dessus (N+2, N+3…), et si toute la hiérarchie est absente, un agent RH.
function getApprover(agentId, dateISO=todayISO()){
  const chain=hierarchyChain(agentId);
  for(let i=0;i<chain.length;i++){
    if(!isAbsent(chain[i].id, dateISO)) return {agent:chain[i], level:"n+"+(i+1)};
  }
  const rh=DB.agents.find(a=>isRHAgent(a) && a.id!==agentId && !isAbsent(a.id, dateISO));
  if(rh) return {agent:rh, level:"rh"};
  return null;
}

/* ---------- Moteur de workflow générique ---------- */
// Chaque type d'objet (congés, allaitement, notation, maternité…) déclare ses propres étapes ;
// le moteur se contente de suivre l'étape courante d'un enregistrement et d'historiser les décisions.
// step.actor(rec) résout dynamiquement qui doit agir (ex: hiérarchie disponible, commission, directeur…).
function nowStamp(){ return new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
const WORKFLOW_DEFS = {
  conges:{
    label:"Demande de congé",
    start:"responsable",
    steps:{
      responsable:{
        label:"Validation hiérarchique",
        actor:rec=>{ const a=getApprover(rec.agentId, todayISO()); return a?{label:agentName(a.agent.id)+" ("+(a.level==="rh"?"RH":a.level)+")", agentId:a.agent.id}:{label:"Aucun validateur disponible"}; },
        actions:[
          {id:"valider", label:"Valider", to:null, setFields:(rec,actor)=>({statut:"Validé", valide:actor.label})},
          {id:"refuser", label:"Refuser", to:null, setFields:(rec,actor)=>({statut:"Refusé", valide:actor.label})}
        ]
      }
    }
  },
  paie:{
    label:"Bulletin de paie",
    start:"controle_df",
    steps:{
      // Le rejet reboucle sur cette même étape (le bulletin corrigé repasse par le même contrôle),
      // ce qui conserve tout l'historique dans un seul et même workflow.
      controle_df:{
        label:"Contrôle Direction Financière",
        actor:()=>{ const df=DB.agents.find(a=>a.direction==="Direction Financière" && a.actif!==false); return df?{label:agentName(df.id), agentId:df.id}:{label:"Direction Financière"}; },
        actions:[
          {id:"valider", label:"Valider le bulletin", to:"pret_paiement", setFields:(rec,actor)=>({statut:"Validée", controlePar:actor.label})},
          {id:"rejeter", label:"Rejeter (à corriger)", to:"controle_df", setFields:(rec,actor)=>({statut:"Rejetée", controlePar:actor.label})}
        ]
      },
      pret_paiement:{
        label:"Prêt pour paiement",
        actor:()=>({label:"Service Paie"}),
        actions:[
          {id:"payer", label:"Marquer comme payé", to:null, setFields:()=>({statut:"Payée"})}
        ]
      }
    }
  }
};
function startWorkflow(defKey, rec){
  rec.workflow={defKey, step:WORKFLOW_DEFS[defKey].start, history:[{step:null, actorLabel:"", action:"Création de la demande", date:nowStamp(), commentaire:""}]};
}
function currentWorkflowStep(rec){
  if(!rec.workflow || !rec.workflow.step) return null;
  return WORKFLOW_DEFS[rec.workflow.defKey].steps[rec.workflow.step];
}
function currentWorkflowActor(rec){
  const step=currentWorkflowStep(rec);
  return step ? step.actor(rec) : null;
}
function advanceWorkflow(rec, actionId, commentaire=""){
  const step=currentWorkflowStep(rec);
  if(!step) return;
  const action=step.actions.find(x=>x.id===actionId);
  if(!action) return;
  const actor=step.actor(rec);
  rec.workflow.history.push({step:step.label, actorLabel:actor.label, action:action.label, date:nowStamp(), commentaire});
  if(action.setFields) Object.assign(rec, action.setFields(rec, actor));
  rec.workflow.step=action.to;
}

// Variables de paie éditables (taux CPS/CST, plafonds) : la génération des bulletins ne code en
// dur aucun taux, tout est lu depuis DB.paieConfig pour rester paramétrable par la RH/Finance.

      {code:"21800",libelle:"CPS Assurance maladie",plafond:null,tauxSalarial:4.98,tauxPatronal:9.96},
      {code:"22800",libelle:"CPS Retraite TA",plafond:269000,tauxSalarial:7.84,tauxPatronal:15.69},
      {code:"23800",libelle:"CPS Retraite TB",plafond:256000,tauxSalarial:5.81,tauxPatronal:11.62},
      {code:"23950",libelle:"CPS FSR Exceptionnel",plafond:386000,tauxSalarial:0,tauxPatronal:1.00},
      {code:"24100",libelle:"CPS Prestations familiales",plafond:null,tauxSalarial:0,tauxPatronal:4.16},
      {code:"24300",libelle:"CPS Accident du travail",plafond:null,tauxSalarial:0,tauxPatronal:0.77},
      {code:"24600",libelle:"Formation professionnelle",plafond:null,tauxSalarial:0,tauxPatronal:0.50}
    ],
    // Contribution de solidarité territoriale : barème progressif par tranches cumulées sur le brut.
    cstTranches:[
      {code:"25000",libelle:"CST à 0,5 %",plafond:150000,taux:0.5},
      {code:"25100",libelle:"CST à 3 %",plafond:250000,taux:3.0},
      {code:"25300",libelle:"CST à 5 %",plafond:400000,taux:5.0},
      {code:"25450",libelle:"CST à 9 %",plafond:null,taux:9.0}
    ],
    // Congés suivis sur le bulletin (solde M-1 / acquis / pris / solde). Les bonus d'ancienneté et
    // « mère de famille » sont des règles indicatives, à ajuster avec la RH selon la convention.
    congesTypes:[
      {code:"CP", libelle:"Congés Payés", acquisParMois:2.5},
      {code:"CPA", libelle:"CP Ancienneté", acquisParMois:0, bonusAnciennete:{seuilAns:10, joursParAn:1}},
      {code:"CPMF", libelle:"CP Mère de Famille", acquisParMois:0, bonusParEnfant:{joursParAnParEnfant:0.5}}
    ]
  };
}
function anneesAnciennete(entree){
  if(!entree) return 0;
  const d0=new Date(entree), d1=new Date();
  let years=d1.getFullYear()-d0.getFullYear();
  if(d1.getMonth()<d0.getMonth() || (d1.getMonth()===d0.getMonth() && d1.getDate()<d0.getDate())) years--;
  return Math.max(0,years);
}
// Calcule, pour chaque type de congé suivi, le solde M-1, l'acquis du mois, le pris du mois et le
// nouveau solde. « Pris » n'est pour l'instant rapproché que des congés annuels validés (type "CP").
function computeCongesRecap(agent, periode, config){
  const soldes = agent.soldes || {CP:agent.solde||0, CPA:0, CPMF:0};
  const anciennete = anneesAnciennete(agent.entree);
  return (config.congesTypes||[]).map(ct=>{
    let acquis = ct.acquisParMois||0;
    if(ct.bonusAnciennete && anciennete>=ct.bonusAnciennete.seuilAns) acquis = ct.bonusAnciennete.joursParAn/12;
    if(ct.bonusParEnfant && agent.civ==="Mme" && (agent.enfantsListe||[]).length>0) acquis = (agent.enfantsListe.length*ct.bonusParEnfant.joursParAnParEnfant)/12;
    let pris=0;
    if(ct.code==="CP"){
      pris = DB.conges.filter(c=>c.agentId===agent.id && c.type==="Congés annuels" && c.statut==="Validé" && (c.debut||"").slice(0,7)===periode)
        .reduce((s,c)=>s+(c.jours||0),0);
    }
    const soldeM1 = soldes[ct.code]||0;
    acquis = Math.round(acquis*100)/100;
    const solde = Math.round((soldeM1+acquis-pris)*100)/100;
    return {code:ct.code, libelle:ct.libelle, soldeM1, acquis, pris, solde};
  });
}
function computeCST(brut, tranches){
  const lines=[]; let prevCap=0;
  (tranches||[]).forEach(t=>{
    const cap = t.plafond==null ? brut : Math.min(brut, t.plafond);
    const base = Math.max(0, cap-prevCap);
    lines.push({...t, base, montant:Math.round(base*t.taux/100)});
    prevCap=cap;
  });
  return lines;
}
function computeBulletin(agent, periode, config){
  const brut=Math.round((agent.salaireBrutMensuel||0)+(agent.primeEmploi||0));
  const lignesCotis=(config.cotisationsBrut||[]).map(c=>{
    const base = c.plafond ? Math.min(brut,c.plafond) : brut;
    return {...c, base, montantSalarial:Math.round(base*c.tauxSalarial/100), montantPatronal:Math.round(base*c.tauxPatronal/100)};
  });
  const cstLignes=computeCST(brut, config.cstTranches);
  const totalCotisSalariales=lignesCotis.reduce((s,l)=>s+l.montantSalarial,0)+cstLignes.reduce((s,l)=>s+l.montant,0);
  const totalCotisPatronales=lignesCotis.reduce((s,l)=>s+l.montantPatronal,0);
  const congesRecap=computeCongesRecap(agent, periode, config);
  return {brut, lignesCotis, cstLignes, totalCotisSalariales, totalCotisPatronales, congesRecap, net:brut-totalCotisSalariales};
}

/* ---------- Profil de test (droits différenciés par profil utilisateur) ---------- */
// Il n'y a pas d'authentification dans ce prototype : ce sélecteur simule "je suis connecté
// en tant que…" pour démontrer que les droits de consultation/modification varient selon le profil.
const SESSION_KEY = KEY+"_session";
let SESSION = {role:"rh", asAgentId:null};
function loadSession(){
  try{ const raw=localStorage.getItem(SESSION_KEY); if(raw) SESSION={...SESSION, ...JSON.parse(raw)}; }catch(e){}
}
function saveSession(){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(SESSION)); }catch(e){} }
function renderSessionBar(){
  const roleSel=document.getElementById("sessRole"), agentSel=document.getElementById("sessAgent");
  roleSel.value=SESSION.role;
  agentSel.innerHTML=DB.agents.map(a=>`<option value="${a.id}">${esc(a.prenom)} ${esc(a.nom)}</option>`).join("");
  if(!SESSION.asAgentId && DB.agents[0]) SESSION.asAgentId=DB.agents[0].id;
  agentSel.value=SESSION.asAgentId;
  agentSel.style.display=SESSION.role==="rh"?"none":"block";
  roleSel.onchange=()=>{
    SESSION.role=roleSel.value;
    agentSel.style.display=SESSION.role==="rh"?"none":"block";
    saveSession();
    go((ROLE_MODULES[SESSION.role]||["dashboard"])[0]);
  };
  agentSel.onchange=()=>{
    SESSION.asAgentId=agentSel.value; saveSession();
    if(ROLE_MODULES[SESSION.role]) go(ROLE_MODULES[SESSION.role][0]);
    else if(view.agentId) renderAgentDetail();
  };
}
// Niveau d'accès au dossier d'un agent pour le profil de test actuel : "rh" (accès complet),
// "self" (l'agent consulte son propre dossier, quel que soit son rôle), "team" (un responsable
// consulte un membre direct de son équipe) ou "none" (accès refusé).
function dossierAccess(a){
  if(SESSION.role==="rh") return "rh";
  if(a.id===SESSION.asAgentId) return "self";
  if(SESSION.role==="responsable" && a.superieurId===SESSION.asAgentId) return "team";
  return "none";
}
// Un document du dossier agent est-il visible pour le profil de test actuellement sélectionné ?
function canViewDocument(doc, agentOfDossier){
  const access=dossierAccess(agentOfDossier);
  if(access==="rh") return true;
  if(access==="none") return false;
  return access==="self" || !doc.confidentiel;
}
// Un document du dossier peut-il être ajouté/modifié/supprimé par le profil de test actuel ?
function canEditDocuments(agentOfDossier){
  const access=dossierAccess(agentOfDossier);
  return access==="rh" || access==="team";
}

  if(id==="resp-validations") return pendingApprovalsFor(SESSION.asAgentId).length;
  if(id==="df-controle") return DB.paie.filter(p=>p.statut==="En contrôle").length;
  return 0;
}
function renderNav(){
  const roleNav=ROLE_NAV[SESSION.role];
  if(roleNav){
    let html="";
    roleNav.forEach(n=>{
      const active=view.module===n.id?"active":"";
      const cnt=navBadgeCount(n.id);
      html+=`<a data-nav="${n.id}" class="${active}">${svg(n.icon)}<span>${n.label}</span>${cnt?`<span class="count">${cnt}</span>`:""}</a>`;
    });
    document.getElementById("nav").innerHTML=html;
    document.querySelectorAll("[data-nav]").forEach(a=>a.onclick=()=>{ go(a.dataset.nav); closeSidebar(); });
    return;
  }
  let html="", lastGroup="__";
  NAV.forEach(n=>{
    if(n.group!==lastGroup){ if(n.group) html+=`<div class="nav-group">${n.group}</div>`; lastGroup=n.group; }
    const active = view.module===n.id ? "active":"";
    let cnt="";
    if(n.id==="conges"){ const c=DB.conges.filter(x=>x.statut==="En attente").length; if(c) cnt=`<span class="count">${c}</span>`; }
    if(n.id==="deplacements"){ const c=DB.deplacements.filter(x=>x.statut==="Demandé").length; if(c) cnt=`<span class="count">${c}</span>`; }
    html+=`<a data-nav="${n.id}" class="${active}">${svg(n.icon)}<span>${n.label}</span>${cnt}</a>`;
  });
  document.getElementById("nav").innerHTML=html;
  document.querySelectorAll("[data-nav]").forEach(a=>a.onclick=()=>{ go(a.dataset.nav); closeSidebar(); });
}

/* ---------- Router ---------- */
function go(module, opts={}){ view={...view, module, agentId:opts.agentId||null, search:"", filter:""}; if(opts.tab) view.tab=opts.tab; render(); }

function render(){
  // Chaque profil restreint (Agent, Responsable, Direction Financière) n'a accès qu'à son propre
  // périmètre ; le RH n'a pas vocation à rester sur ces pages self-service (elles n'ont de sens
  // que rattachées à SESSION.asAgentId). On ne redirige pas si un dossier d'agent est ouvert
  // (view.agentId) : c'est à renderAgentDetail() / dossierAccess() de statuer sur ce cas-là.
  const allowed=ROLE_MODULES[SESSION.role];
  if(!view.agentId){
    if(allowed && !allowed.includes(view.module)) view.module=allowed[0];
    else if(!allowed && ALL_RESTRICTED_MODULES.includes(view.module)) view.module="dashboard";
  }
  renderNav();
  const c=document.getElementById("content");
  const t=document.getElementById("pageTitle"), s=document.getElementById("pageSub"), act=document.getElementById("pageActions");
  act.innerHTML="";
  if(view.module==="mon-dashboard"){ t.textContent="Mon espace"; s.textContent="Ma situation personnelle"; c.innerHTML=renderMonEspace(); bindMonEspace(); return; }
  if(view.module==="mon-dossier"){ view.agentId=SESSION.asAgentId; renderAgentDetail(); return; }
  if(view.module==="mes-conges"){
    t.textContent="Mes congés & absences"; s.textContent="Solde, historique et demandes";
    act.innerHTML=`<button class="btn primary" id="addBtn">${svg(I.plus)} Nouvelle demande</button>`;
    c.innerHTML=renderMesConges(); bindMesConges();
    document.getElementById("addBtn").onclick=()=>openForm("conges", null, {agentId:SESSION.asAgentId}, {selfService:true});
    return;
  }
  if(view.module==="resp-dashboard"){ t.textContent="Tableau de bord équipe"; s.textContent="Vue d'ensemble de mon équipe"; c.innerHTML=renderRespDashboard(); bindRespDashboard(); return; }
  if(view.module==="resp-equipe"){ const team=DB.agents.filter(a=>a.superieurId===SESSION.asAgentId); t.textContent="Mon équipe"; s.textContent=`${team.length} agent${team.length>1?"s":""} rattaché${team.length>1?"s":""}`; c.innerHTML=renderMonEquipe(); bindMonEquipe(); return; }
  if(view.module==="resp-validations"){ t.textContent="Validations congés"; s.textContent="Demandes de mon équipe en attente de ma validation"; c.innerHTML=renderValidations(); bindValidations(); return; }
  if(view.module==="df-controle"){ t.textContent="Contrôle des bulletins"; s.textContent="Bulletins de paie soumis au contrôle de la Direction Financière"; c.innerHTML=renderDFControle(); bindDFControle(); return; }
  if(view.module==="dashboard"){ t.textContent="Tableau de bord"; s.textContent="Vue d'ensemble des effectifs et des demandes en cours"; c.innerHTML=renderDashboard(); bindDashboard(); return; }
  if(view.agentId){ renderAgentDetail(); return; }
  const nav=NAV.find(n=>n.id===view.module);
  t.textContent=nav.label;
  const coll=DB[nav.coll];
  s.textContent=`${coll.length} enregistrement${coll.length>1?"s":""}`;
  act.innerHTML=`<button class="btn primary" id="addBtn">${svg(I.plus)} Nouveau</button>`;
  document.getElementById("addBtn").onclick=()=>openForm(view.module);
  if(view.module==="paie"){
    act.innerHTML+=` <button class="btn" id="genBulletinsBtn">${svg(I.plus,'ic')} Générer une période</button> <button class="btn" id="paieConfigBtn">${svg(I.settings,'ic')} Variables de paie</button>`;
  }
  c.innerHTML = LISTS[view.module]();
  bindList();
  if(view.module==="paie"){
    document.getElementById("genBulletinsBtn").onclick=()=>openGenerateBulletins();
    document.getElementById("paieConfigBtn").onclick=()=>openPaieConfigForm();
  }
}

function renderMesConges(){
  let rows=DB.conges.filter(c=>c.agentId===SESSION.asAgentId).map(c=>({...c,_search:`${c.type} ${c.statut}`,_filterVal:c.statut}));

/* ---------- Dashboard ---------- */
function renderDashboard(){
  const total=DB.agents.length, actifs=DB.agents.filter(a=>a.actif!==false).length;
  const pendConges=DB.conges.filter(c=>c.statut==="En attente");
  const pendDep=DB.deplacements.filter(d=>d.statut==="Demandé");
  const today=todayISO();
  const visRetard=DB.visites.filter(v=>!v.realisee && v.prevue && v.prevue<today);
  const visAvenir=DB.visites.filter(v=>!v.realisee && v.prevue && v.prevue>=today);
  const atOuverts=DB.accidents.filter(a=>a.statut!=="Clôturé"&&a.statut!=="Clôturé sans suite");
  const formEnCours=DB.formations.filter(f=>f.statut==="En cours"||f.statut==="Prévue");
  const masseNet=DB.paie.filter(p=>p.periode===today.slice(0,7)).reduce((s,p)=>s+(p.net||0),0);

  // répartition par direction
  const byDir={};
  DB.agents.filter(a=>a.actif!==false).forEach(a=>{byDir[a.direction]=(byDir[a.direction]||0)+1;});
  const dirColors=["#0f6e6a","#2f6f9f","#b57812","#2f8f5b","#7a5bb0","#c0453b","#0a504d"];
  const maxDir=Math.max(1,...Object.values(byDir));

  const kpi=(lbl,val,meta,cls,mod)=>`<div class="kpi" tabindex="0" data-goto="${mod||''}">
    <div class="k-lbl">${lbl}</div><div class="k-val">${val}</div>
    ${meta?`<div class="k-meta ${cls||'mut'}">${meta}</div>`:''}</div>`;

  let html=`<div class="kpi-grid">
    ${kpi("Effectif total", total, `${actifs} agent${actifs>1?'s':''} actif${actifs>1?'s':''}`, "mut","agents")}
    ${kpi("Congés à valider", pendConges.length, pendConges.length?"Action requise":"À jour", pendConges.length?"warn":"ok","conges")}
    ${kpi("Déplacements à valider", pendDep.length, pendDep.length?"Action requise":"À jour", pendDep.length?"warn":"ok","deplacements")}
    ${kpi("Visites en retard", visRetard.length, visRetard.length?"À planifier":"Aucune", visRetard.length?"bad":"ok","visites")}
    ${kpi("Accidents ouverts", atOuverts.length, atOuverts.length?"En instruction":"Aucun", atOuverts.length?"warn":"ok","accidents")}
    ${kpi("Formations en cours", formEnCours.length, "Prévues + en cours","mut","formations")}
  </div>`;

  html+=`<div class="panels">
    <div class="panel">
      <div class="panel-head"><h3>Demandes en attente de validation</h3><div class="spacer"></div><span class="tag">${pendConges.length+pendDep.length}</span></div>
      <div class="panel-body">`;
  const pend=[...pendConges.map(c=>({t:"congé",who:agentName(c.agentId),det:`${c.type} · ${fmtDate(c.debut)} → ${fmtDate(c.fin)} (${c.jours} j)`,mod:"conges"})),
              ...pendDep.map(d=>({t:"déplacement",who:agentName(d.agentId),det:`${d.destination} · ${fmtDate(d.depart)}`,mod:"deplacements"}))];
  if(!pend.length) html+=`<div class="empty">Aucune demande en attente. Tout est à jour.</div>`;
  else pend.forEach(p=>{ html+=`<div class="mini-row" data-goto="${p.mod}"><div class="av">${initials(p.who.split(' ')[1]||'',p.who.split(' ')[0]||'')}</div><div><div class="who">${esc(p.who)}</div><div class="det">${esc(p.det)}</div></div><div class="spacer"></div><span class="tag">${p.t}</span></div>`; });
  html+=`</div></div>
    <div class="panel">
      <div class="panel-head"><h3>Santé au travail</h3></div>
      <div class="panel-body">`;
  const alerts=[...visRetard.map(v=>({who:agentName(v.agentId),det:`Visite ${v.type.toLowerCase()} · prévue le ${fmtDate(v.prevue)}`,cls:"bad",lbl:"en retard"})),
                ...visAvenir.map(v=>({who:agentName(v.agentId),det:`Visite ${v.type.toLowerCase()} · ${fmtDate(v.prevue)}`,cls:"warn",lbl:"à venir"})),
                ...atOuverts.map(a=>({who:agentName(a.agentId),det:`Accident du ${fmtDate(a.date)} · ${a.statut}`,cls:"warn",lbl:"AT"}))];
  if(!alerts.length) html+=`<div class="empty">Aucune alerte santé au travail.</div>`;
  else alerts.slice(0,7).forEach(a=>{ html+=`<div class="mini-row"><div><div class="who">${esc(a.who)}</div><div class="det">${esc(a.det)}</div></div><div class="spacer"></div><span class="badge ${a.cls}">${a.lbl}</span></div>`; });
  html+=`</div></div></div>`;

  // répartition par direction
  html+=`<div class="panel" style="margin-top:16px">
    <div class="panel-head"><h3>Répartition des effectifs par direction</h3></div>
    <div class="panel-body" style="padding:14px 18px">`;
  Object.entries(byDir).sort((a,b)=>b[1]-a[1]).forEach(([d,n],i)=>{
    html+=`<div style="margin-bottom:11px">
      <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:600"><span>${esc(d)}</span><span style="font-variant-numeric:tabular-nums">${n}</span></div>
      <div class="progress"><i style="width:${Math.round(n/maxDir*100)}%;background:${dirColors[i%dirColors.length]}"></i></div>
    </div>`;
  });
  html+=`</div></div>`;
  return html;
}
function bindDashboard(){ document.querySelectorAll("[data-goto]").forEach(el=>{ if(el.dataset.goto) el.onclick=()=>go(el.dataset.goto); }); }

/* ---------- Generic list helpers ---------- */
function filterRows(rows){
  const q=view.search.trim().toLowerCase();
  const f=view.filter;
  return rows.filter(r=>{
    if(f && r._filterVal!==f) return false;
    if(!q) return true;
    return r._search.toLowerCase().includes(q);
  });
}
function toolbar(filterKey, filterOpts){
  let sel="";
  if(filterOpts){
    sel=`<select class="filter-sel" id="filterSel"><option value="">Tous</option>${filterOpts.map(o=>`<option value="${esc(o)}" ${view.filter===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
  }
  return `<div class="toolbar">
    <div class="search">${svg(I.search)}<input id="searchInp" placeholder="Rechercher…" value="${esc(view.search)}"></div>
    ${sel}
  </div>`;
}
function tableShell(cols, bodyRows){
  if(!bodyRows.trim()) bodyRows=`<tr><td colspan="${cols.length}"><div class="empty">Aucun résultat.</div></td></tr>`;
  return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th ${c.num?'style="text-align:right"':''}>${c.h}</th>`).join("")}</tr></thead><tbody>${bodyRows}</tbody></table></div>`;
}
function rowActions(module,id,extra=""){
  return `<div class="row-actions">${extra}
    <button class="btn ghost sm" data-edit="${id}" title="Modifier">${svg(I.edit,'ic')}</button>
    <button class="btn ghost sm" data-del="${id}" data-mod="${module}" title="Supprimer">${svg(I.trash,'ic')}</button>
  </div>`;
}

    rows=filterRows(rows);
    const cols=[{h:"Agent"},{h:"Matricule"},{h:"Statut"},{h:"Direction"},{h:"Fonction"},{h:"Solde CA",num:true},{h:"État"},{h:""}];
    const body=rows.map(a=>`<tr data-open="${a.id}" style="cursor:pointer">
      <td><div class="name-cell"><div class="av">${initials(a.nom,a.prenom)}</div><div><div class="cell-name">${esc(a.prenom)} ${esc(a.nom)}</div><div class="cell-sub">${esc(a.grade||"")}</div></div></div></td>

  conges(){

    const body=rows.map(c=>{
      let validCell;

      const extra=(c.statut==="En attente"
        ? `<button class="btn ghost sm" data-approve="${c.id}" data-mod="conges" title="Valider">${svg(I.check,'ic')}</button>

      return `<tr>
      <td class="cell-name">${esc(agentName(c.agentId))}</td>
      <td>${esc(c.type)}</td>
      <td>${fmtDate(c.debut)} → ${fmtDate(c.fin)}</td>
      <td class="num">${c.jours}</td>
      <td>${validCell}</td>
      <td>${badge(c.statut)}</td>

  },
  paie(){

    rows=filterRows(rows).sort((a,b)=>(b.periode||"").localeCompare(a.periode||""));

    const body=rows.map(p=>`<tr>
      <td class="cell-name">${esc(agentName(p.agentId))}</td>
      <td>${esc(p.periode)}</td>

    rows=filterRows(rows).sort((a,b)=>(b.depart||"").localeCompare(a.depart||""));

    const body=rows.map(d=>`<tr>
      <td class="cell-name">${esc(agentName(d.agentId))}</td>

      <td>${esc(d.destination)}</td>
      <td>${fmtDate(d.depart)}${d.retour&&d.retour!==d.depart?" → "+fmtDate(d.retour):""}</td>
      <td>${esc(d.transport||"—")}</td>

      <td>${badge(d.statut)}</td>
      <td>${rowActions("deplacements",d.id, d.statut==="Demandé"?`<button class="btn ghost sm" data-approve="${d.id}" data-mod="deplacements" title="Valider">${svg(I.check,'ic')}</button>`:"")}</td>

function bindList(){
  const si=document.getElementById("searchInp");
  if(si) si.oninput=()=>{ view.search=si.value; const c=document.getElementById("content"); c.innerHTML=LISTS[view.module](); bindList(); const n=document.getElementById("searchInp"); n.focus(); n.setSelectionRange(n.value.length,n.value.length); };
  const fs=document.getElementById("filterSel");
  if(fs) fs.onchange=()=>{ view.filter=fs.value; const c=document.getElementById("content"); c.innerHTML=LISTS[view.module](); bindList(); };
  document.querySelectorAll("[data-open]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); go("agents",{agentId:el.dataset.open}); });
  document.querySelectorAll("[data-edit]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openForm(view.module, el.dataset.edit); });
  document.querySelectorAll("[data-del]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); delRecord(el.dataset.mod, el.dataset.del); });
  document.querySelectorAll("[data-approve]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); approve(el.dataset.mod, el.dataset.approve); });
  document.querySelectorAll("[data-refuse]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); decideConge(el.dataset.refuse,"refuser"); });
  document.querySelectorAll("[data-teams]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openTeamsModal(el.dataset.teams); });
  document.querySelectorAll("[data-history]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openWorkflowHistory(el.dataset.history); });
  document.querySelectorAll("[data-view]").forEach(el=>el.onclick=(e)=>{ e.stopPropagation(); openBulletinDetail(el.dataset.view); });
}

function renderDetailPane(a){
  const pane=document.getElementById("detailPane");
  const access=dossierAccess(a);
  if(view.tab==="documents"){ renderDocumentsPane(pane, a, access); return; }
  let rows=DB[view.tab].filter(x=>x.agentId===a.id);
  // Seule la RH gère librement tous les onglets ; le profil "self" (l'agent, quel que soit son
  // rôle) peut uniquement déposer une demande de congés ; un responsable ("team") ne fait que consulter.
  const canAdd = access==="rh" ? true : (view.tab==="conges" && access==="self");
  const canEditRow = access==="rh";
  const addBtn=canAdd?`<button class="btn primary sm" id="detailAdd">${svg(I.plus)} Ajouter</button>`:"";
  const head=(title)=>`<div class="panel-head" style="border-radius:10px 10px 0 0"><h3>${title}</h3><div class="spacer"></div>${addBtn}</div>`;
  let inner="";
  if(!rows.length){ inner=`<div class="empty">Aucun enregistrement pour cet agent.</div>`; }
  else{
    inner=`<div style="overflow-x:auto"><table><tbody>`+rows.map(r=>{
      let main="", sub="", right="", viewBtn="";
      if(view.tab==="conges"){ main=r.type; sub=`${fmtDate(r.debut)} → ${fmtDate(r.fin)} · ${r.jours} j`; right=badge(r.statut); }
      else if(view.tab==="paie"){ main=r.periode; sub=`Net ${fmtMoney(r.net)}`; right=badge(r.statut); viewBtn=`<button class="btn ghost sm" data-view="${r.id}" title="Voir le bulletin">${svg(I.eye,'ic')}</button>`; }
      else if(view.tab==="formations"){ main=r.intitule; sub=`${r.organisme||""} · ${r.debut?fmtDate(r.debut):""}`; right=badge(r.statut); }
      else if(view.tab==="visites"){ main=r.type; sub=`${fmtDate(r.prevue)}${r.realisee?" · réalisée "+fmtDate(r.realisee):""}`; right=badge(r.avis); }
      else if(view.tab==="accidents"){ main=fmtDate(r.date); sub=`${r.lesions||""}${r.cafat?" · "+r.cafat:""}`; right=badge(r.statut); }
      else if(view.tab==="deplacements"){ main=r.objet; sub=`${r.destination} · ${fmtDate(r.depart)}`; right=badge(r.statut); }
      else if(view.tab==="carriere"){ main=r.type; sub=`${fmtDate(r.date)}${r.poste?" · "+r.poste:""}${r.direction?" · "+r.direction:""}`; }
      return `<tr>
        <td><div class="cell-name">${esc(main)}</div><div class="cell-sub">${esc(sub)}</div></td>
        <td style="text-align:right">${right}</td>
        <td style="width:1%">${viewBtn}${canEditRow?rowActions(view.tab,r.id):""}</td>
      </tr>`;
    }).join("")+`</tbody></table></div>`;
  }
  pane.innerHTML=`<div class="panel">${head(TAB_LABELS[view.tab])}<div class="panel-body" style="padding:6px">${inner}</div></div>`;
  const detailAdd=document.getElementById("detailAdd");
  if(detailAdd) detailAdd.onclick=()=>openForm(view.tab, null, {agentId:a.id}, access!=="rh"?{selfService:true}:{});
  pane.querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>openForm(view.tab, el.dataset.edit));
  pane.querySelectorAll("[data-del]").forEach(el=>el.onclick=()=>delRecord(el.dataset.mod, el.dataset.del));
  pane.querySelectorAll("[data-view]").forEach(el=>el.onclick=()=>openBulletinDetail(el.dataset.view));
}
// Onglet Documents : arborescence par catégories (façon coffre-fort numérique), avec les
// bulletins de paie générés regroupés par année plutôt que dupliqués en documents génériques.
function renderDocumentsPane(pane, a, access){
  const canAdd=canEditDocuments(a);
  const docs=DB.documents.filter(d=>d.agentId===a.id && canViewDocument(d,a));
  const byCat={};
  docs.forEach(d=>{ const cat=docCategoryOf(d.type); (byCat[cat]=byCat[cat]||[]).push(d); });
  const canSeeBulletins = access==="rh" || access==="self";
  const bulletins = canSeeBulletins ? DB.paie.filter(p=>p.agentId===a.id) : [];
  const byYear={};
  bulletins.forEach(p=>{ const y=(p.periode||"").slice(0,4)||"—"; (byYear[y]=byYear[y]||[]).push(p); });
  const years=Object.keys(byYear).sort((x,y)=>y.localeCompare(x));

  const addBtn=canAdd?`<button class="btn primary sm" id="detailAdd">${svg(I.plus)} Ajouter</button>`:"";
  let html=`<div class="doc-tree">`;
  DOC_CATEGORY_ORDER.filter(cat=>cat!=="Bulletins de paie").forEach(cat=>{
    const items=byCat[cat]||[];
    const cid="cat-"+cat.replace(/[^a-zA-Z0-9]/g,"");
    html+=`<div class="doc-cat">
      <button class="doc-cat-head" data-toggle="${cid}">${svg(I.chevron,'chev')}<span>${esc(cat)}</span><span class="tag">${items.length}</span></button>
      <div class="doc-cat-body" id="${cid}" hidden>
        ${items.length?items.map(d=>`<div class="doc-row">
            <div><div class="cell-name">${esc(d.type)}</div><div class="cell-sub">${esc(d.libelle)} · ${fmtDate(d.dateAjout)}</div></div>
            <div class="spacer"></div>
            ${d.confidentiel?'<span class="badge warn">RH uniquement</span>':'<span class="badge ok">Visible équipe</span>'}
            ${canAdd?`<div class="row-actions"><button class="btn ghost sm" data-edit="${d.id}" title="Modifier">${svg(I.edit,'ic')}</button><button class="btn ghost sm" data-del="${d.id}" data-mod="documents" title="Supprimer">${svg(I.trash,'ic')}</button></div>`:""}
          </div>`).join(""):`<div class="empty">Aucun document.</div>`}
      </div>
    </div>`;
  });
  if(canSeeBulletins){
    html+=`<div class="doc-cat">

            </div>`).join("")}

}

/* ---------- Form modal ---------- */
function openForm(module, id=null, preset={}, opts={}){
  const cfg=FORMS[module];
  const coll=DB[module];
  const rec = id ? {...coll.find(x=>x.id===id)} : {...cfg.defaults(), ...preset};
  const isEdit=!!id;

  const fieldHTML=(f)=>{
    if(f.hideSelf && opts.selfService) return "";
    if(f.s) return `<div class="form-section">${esc(f.s)}</div>`;
    const val = rec[f.k];
    const req = f.req?'<span class="req"> *</span>':"";
    let input="";
    const disabled = (module!=="agents" && f.k==="agentId" && preset.agentId) ? "disabled":"";
    if(f.t==="select"){
      input=`<select data-k="${f.k}">${f.o.map(o=>`<option value="${esc(o)}" ${val===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`;
    } else if(f.t==="ref"){
      const opts = agentOptions().filter(o=> f.excludeId ? o.v!==rec.id : true);
      const optional = f.req ? "" : `<option value="" ${!val?"selected":""}>—</option>`;
      input=`<select data-k="${f.k}" ${f.req?"":'data-empty-null="1"'} ${disabled}>${optional}${opts.map(o=>`<option value="${o.v}" ${val===o.v?"selected":""}>${esc(o.l)}</option>`).join("")}</select>`;
    } else if(f.t==="textarea"){
      input=`<textarea data-k="${f.k}">${esc(val||"")}</textarea>`;
    } else if(f.t==="bool"){
      input=`<select data-k="${f.k}" data-bool="1"><option value="true" ${val!==false?"selected":""}>Oui</option><option value="false" ${val===false?"selected":""}>Non</option></select>`;
    } else if(f.t==="number"){
      input=`<input type="number" data-k="${f.k}" data-num="1" value="${val??""}">`;
    } else if(f.t==="month"){
      input=`<input type="month" data-k="${f.k}" value="${esc(val||"")}">`;
    } else {
      input=`<input type="${f.t}" data-k="${f.k}" value="${esc(val||"")}">`;
    }
    return `<div class="field ${f.full?'full':''}"><label>${esc(f.l)}${req}</label>${input}${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`;
  };

  const body=`<div class="form-grid">${cfg.fields.map(fieldHTML).join("")}</div>`;
  const mr=document.getElementById("modalRoot");
  mr.innerHTML=`<div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head"><h3>${isEdit?"Modifier":"Nouveau"} — ${esc(cfg.title)}</h3><div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button></div>
      <div class="modal-body">${body}</div>
      <div class="modal-foot">
        <button class="btn" id="cancelModal">Annuler</button>
        <button class="btn primary" id="saveModal">${svg(I.check)} Enregistrer</button>
      </div>
    </div></div>`;

  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;
  document.getElementById("cancelModal").onclick=close;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };
  document.getElementById("saveModal").onclick=()=>{
    // Pour une création, on part de rec (défauts + preset) afin que les champs masqués en
    // self-service (ex: statut/valide d'un congé) conservent leur valeur par défaut.
    const obj = isEdit ? rec : {...rec};
    let ok=true;
    mr.querySelectorAll("[data-k]").forEach(el=>{
      const k=el.dataset.k; let v=el.value;
      if(el.dataset.num) v = v===""?null:Number(v);
      if(el.dataset.bool) v = (v==="true");
      if(el.dataset.emptyNull && v==="") v = null;
      obj[k]=v;
    });
    // required check
    for(const f of cfg.fields){ if(f.req){ const v=obj[f.k]; if(v===""||v==null){ ok=false; toast(`Champ requis : ${f.l}`); break; } } }
    if(!ok) return;
    if(cfg.compute) Object.assign(obj, cfg.compute(obj));
    let teamsToast=null;
    if(isEdit){ const idx=coll.findIndex(x=>x.id===id); coll[idx]={...coll[idx],...obj}; }
    else{
      obj.id=uid(module[0]+"_");
      if(module==="agents"){ const nums=DB.agents.map(a=>parseInt((a.matricule||"AG-1000").replace(/\D/g,""))||1000); obj.matricule="AG-"+(Math.max(1000,...nums)+1); }
      if(module==="conges"){
        startWorkflow("conges", obj);
        const appr=getApprover(obj.agentId, todayISO());
        const msg=`Nouvelle demande de congés — ${agentName(obj.agentId)}\n${obj.type} du ${fmtDate(obj.debut)} au ${fmtDate(obj.fin)} (${obj.jours} j).${obj.motif?`\nMotif : ${obj.motif}`:""}\nMerci de valider ou refuser cette demande.`;
        if(appr){
          obj.teamsTo=appr.agent.id; obj.teamsLevel=appr.level;
          obj.teamsLog=[{from:"Système RH", text:msg, at:new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}];
          teamsToast=`Demande créée et transmise sur Teams à ${agentName(appr.agent.id)}${appr.level==="rh"?" (RH, hiérarchie indisponible)":""}`;
        } else {
          obj.teamsTo=null; obj.teamsLevel=null; obj.teamsLog=[];
          teamsToast="Demande créée — aucun validateur disponible, la RH doit intervenir manuellement";
        }
      }
      coll.push(obj);
    }
    save(); close(); toast(teamsToast || (isEdit?"Modifications enregistrées":"Enregistrement créé"));
    if(view.agentId) renderAgentDetail(); else render();
  };
}

/* ---------- Actions ---------- */
function delRecord(module,id){
  const coll=DB[module];
  const rec=coll.find(x=>x.id===id);
  let label = module==="agents" ? `${rec.prenom} ${rec.nom}` : "cet enregistrement";
  if(!confirm(`Supprimer ${module==="agents"?label:"cet enregistrement"} ? Cette action est définitive.`)) return;
  const idx=coll.findIndex(x=>x.id===id);
  coll.splice(idx,1);
  save(); toast("Supprimé");
  if(view.agentId){ if(module==="agents"){ go("agents"); } else renderAgentDetail(); }
  else render();
}
function approve(module,id){
  if(module==="conges"){ decideConge(id,"valider"); return; }
  const rec=DB[module].find(x=>x.id===id);
  if(module==="deplacements") rec.statut="Validé";
  rec.valide=rec.valide||"Validé (RH)";
  save(); toast("Demande validée");
  if(view.agentId) renderAgentDetail(); else render();
}
function decideConge(id, actionId){
  const rec=DB.conges.find(x=>x.id===id);
  if(!rec) return;
  if(rec.workflow) advanceWorkflow(rec, actionId);
  else rec.statut = actionId==="valider" ? "Validé" : "Refusé";
  save();
  toast(actionId==="valider" ? "Demande validée" : "Demande refusée");
  if(view.agentId) renderAgentDetail(); else render();
}

/* ---------- Notification Teams (conversation simulée) ---------- */
function openTeamsModal(id){

  if(!c.teamsLog) c.teamsLog=[];
  if(!appr && !c.teamsLog.length){ toast("Aucun validateur disponible actuellement — la RH doit intervenir manuellement"); return; }
  const defaultMsg=`Nouvelle demande de congés — ${agentName(c.agentId)}\n${c.type} du ${fmtDate(c.debut)} au ${fmtDate(c.fin)} (${c.jours} j).${c.motif?`\nMotif : ${c.motif}`:""}\nMerci de valider ou refuser cette demande.`;
  const target = appr ? appr.agent : DB.agents.find(a=>a.id===c.teamsTo);
  const levelLabel = appr ? (appr.level==="rh" ? "RH · hiérarchie indisponible" : "Supérieur hiérarchique · "+appr.level) : "Destinataire précédent";
  const bubbles = c.teamsLog.map(m=>`<div class="teams-msg out"><div class="teams-bubble"><div class="teams-from">${esc(m.from)}</div><div class="teams-text">${esc(m.text).replace(/\n/g,"<br>")}</div><div class="teams-time">${esc(m.at)}</div></div></div>`).join("");
  const mr=document.getElementById("modalRoot");
  mr.innerHTML=`<div class="overlay" id="overlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="av" style="background:#464775;color:#fff">${target?initials(target.nom,target.prenom):"?"}</div>
        <div><h3 style="margin:0">${target?esc(target.prenom)+" "+esc(target.nom):"Destinataire inconnu"}</h3><div class="sub" style="font-size:12px;color:var(--ink-3)">Teams · ${levelLabel}</div></div>
        <div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button>
      </div>
      <div class="modal-body">
        <div class="teams-thread">${c.teamsLog.length?bubbles:`<div class="empty">Aucun message envoyé pour l'instant.</div>`}</div>
      </div>
      <div class="modal-foot" style="flex-direction:column;align-items:stretch;gap:8px">
        <textarea id="teamsMsg" placeholder="Message à envoyer sur Teams…">${c.teamsLog.length?"":esc(defaultMsg)}</textarea>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button class="btn" id="cancelModal">Fermer</button>
          <button class="btn primary" id="sendTeams" ${appr?"":"disabled"}>${svg(I.check)} Envoyer sur Teams</button>
        </div>
      </div>
    </div></div>`;
  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;
  document.getElementById("cancelModal").onclick=close;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };
  const sendBtn=document.getElementById("sendTeams");
  if(sendBtn) sendBtn.onclick=()=>{
    const txt=document.getElementById("teamsMsg").value.trim();
    if(!txt){ toast("Message vide"); return; }
    c.teamsLog.push({from:"Système RH", text:txt, at:new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})});
    c.teamsTo=appr.agent.id; c.teamsLevel=appr.level;
    save();
    toast(`Message envoyé sur Teams à ${agentName(appr.agent.id)}`);
    openTeamsModal(id);
  };
}

/* ---------- Génération et contrôle des bulletins de paie ---------- */
function openGenerateBulletins(){
  const mr=document.getElementById("modalRoot");
  mr.innerHTML=`<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head"><h3>Générer les bulletins de paie</h3><div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field"><label>Période (mois)</label><input type="month" id="genPeriode" value="${todayISO().slice(0,7)}"></div>
      </div>
      <p class="hint" style="margin-top:10px;display:block">Un bulletin est généré pour chaque agent actif n'en ayant pas déjà un sur cette période, à partir de son traitement de base, de sa prime à l'emploi et des variables de paie configurées (cotisations CPS/CST).</p>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelModal">Annuler</button><button class="btn primary" id="genBtn">${svg(I.check)} Générer</button></div>
  </div></div>`;
  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;
  document.getElementById("cancelModal").onclick=close;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };
  document.getElementById("genBtn").onclick=()=>{
    const periode=document.getElementById("genPeriode").value;
    if(!periode){ toast("Choisir une période"); return; }
    let created=0;
    DB.agents.filter(a=>a.actif!==false).forEach(a=>{
      if(DB.paie.some(p=>p.agentId===a.id && p.periode===periode)) return;
      const calc=computeBulletin(a, periode, DB.paieConfig);
      DB.paie.push({
        id:uid("p_"), agentId:a.id, periode,
        brut:calc.brut, primes:a.primeEmploi||0,
        lignesCotis:calc.lignesCotis, cstLignes:calc.cstLignes,
        cotis:calc.totalCotisSalariales, cotisPatronales:calc.totalCotisPatronales,
        congesRecap:calc.congesRecap,
        net:calc.net, statut:"Brouillon"
      });
      // Fait progresser les compteurs de congés de l'agent (solde M-1 + acquis - pris = nouveau solde).
      if(!a.soldes) a.soldes={CP:a.solde??0, CPA:0, CPMF:0};
      calc.congesRecap.forEach(r=>{ a.soldes[r.code]=r.solde; });
      a.solde=a.soldes.CP;
      created++;
    });
    save(); close();
    toast(created?`${created} bulletin(s) généré(s) pour ${periode}`:"Tous les agents actifs ont déjà un bulletin pour cette période");
    render();
  };
}

      <div class="form-section" style="margin-top:14px">Autres paramètres</div>

        <div class="field"><label>Horaire mensuel de référence</label><input type="number" id="cfgHoraire" value="${cfg.horaireMensuel}"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" id="cancelModal">Annuler</button><button class="btn primary" id="saveModal">${svg(I.check)} Enregistrer</button></div>
  </div></div>`;
  const close=()=>{ mr.innerHTML=""; };
  document.getElementById("closeModal").onclick=close;
  document.getElementById("cancelModal").onclick=close;
  document.getElementById("overlay").onclick=(e)=>{ if(e.target.id==="overlay") close(); };
  document.getElementById("saveModal").onclick=()=>{
    document.querySelectorAll("#cotisList .child-row").forEach(row=>{
      const i=Number(row.dataset.i);
      row.querySelectorAll("[data-cf]").forEach(inp=>{ cfg.cotisationsBrut[i][inp.dataset.cf]=inp.value===""?null:Number(inp.value); });
    });
    document.querySelectorAll("#cstList .child-row").forEach(row=>{
      const i=Number(row.dataset.i);
      row.querySelectorAll("[data-cf]").forEach(inp=>{ cfg.cstTranches[i][inp.dataset.cf]=inp.value===""?null:Number(inp.value); });
    });
    document.querySelectorAll("#congesList .child-row").forEach(row=>{
      const i=Number(row.dataset.i);
      row.querySelectorAll("[data-cf]").forEach(inp=>{ cfg.congesTypes[i][inp.dataset.cf]=Number(inp.value)||0; });
    });
    cfg.horaireMensuel=Number(document.getElementById("cfgHoraire").value)||0;
    save(); close(); toast("Variables de paie mises à jour");
  };
}
function paieActionsHTML(p){
  const canControl = SESSION.role==="df" || SESSION.role==="rh";
  let html="";
  if(p.statut==="Brouillon" && SESSION.role==="rh") html+=`<button class="btn primary sm" id="submitControle">${svg(I.check,'ic')} Soumettre au contrôle</button>`;
  if(p.statut==="Rejetée" && SESSION.role==="rh") html+=`<button class="btn primary sm" id="resubmitControle">${svg(I.check,'ic')} Resoumettre au contrôle</button>`;
  if(p.statut==="En contrôle" && canControl) html+=`<button class="btn primary sm" id="validerBulletin">${svg(I.check,'ic')} Valider</button> <button class="btn sm" id="rejeterBulletin">${svg(I.x,'ic')} Rejeter</button>`;
  if(p.statut==="Validée" && canControl) html+=`<button class="btn primary sm" id="marquerPaye">${svg(I.check,'ic')} Marquer payé</button>`;
  return html;
}
function wireBulletinActions(p){
  const rerender=(msg)=>{ save(); document.getElementById("modalRoot").innerHTML=""; toast(msg); render(); };
  const sub=document.getElementById("submitControle");
  if(sub) sub.onclick=()=>{ startWorkflow("paie", p); p.statut="En contrôle"; rerender("Bulletin soumis au contrôle de la Direction Financière"); };
  const resub=document.getElementById("resubmitControle");
  if(resub) resub.onclick=()=>{
    if(!p.workflow) startWorkflow("paie", p);
    p.workflow.history.push({step:"Contrôle Direction Financière", actorLabel:"", action:"Resoumission au contrôle", date:nowStamp(), commentaire:""});
    p.statut="En contrôle"; rerender("Bulletin resoumis au contrôle");
  };
  const val=document.getElementById("validerBulletin");
  if(val) val.onclick=()=>{ advanceWorkflow(p,"valider"); rerender("Bulletin validé"); };
  const rej=document.getElementById("rejeterBulletin");
  if(rej) rej.onclick=()=>{ advanceWorkflow(p,"rejeter"); rerender("Bulletin rejeté, à corriger"); };
  const pay=document.getElementById("marquerPaye");
  if(pay) pay.onclick=()=>{ advanceWorkflow(p,"payer"); rerender("Bulletin marqué comme payé"); };
}

    <div class="modal-head"><h3>Bulletin de paie — ${esc(agentName(p.agentId))} · ${esc(p.periode)}</h3><div class="spacer"></div><button class="close-x" id="closeModal">${svg(I.x)}</button></div>
    <div class="modal-body">

          <tr><td>Prime à l'emploi</td><td class="num">${fmtMoney(a?.primeEmploi)}</td><td></td><td></td><td></td><td></td></tr>

          ${cotisRows}${cstRows}

document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : (cur==="light" ? "dark" : "dark");
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem(KEY+"_theme",next); }catch(e){}
};
