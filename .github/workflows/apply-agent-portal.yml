name: Apply agent portal completion
on:
  push:
    branches:
      - feature/espace-agent-rh
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/espace-agent-rh
          fetch-depth: 0
      - name: Skip generated commit
        id: guard
        run: |
          MSG="$(git log -1 --pretty=%s)"
          if [ "$MSG" = "chore(rh): complete agent portal" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Patch agent portal
        if: steps.guard.outputs.skip != 'true'
        shell: python
        run: |
          from pathlib import Path
          p = Path("rh/index.html")
          s = p.read_text(encoding="utf-8")
          marker = "/* ---------- Chrome ---------- */"
          if "AGENT_PORTAL_COMPLETION_V1" in s:
              raise SystemExit("Agent portal completion already applied")
          block = r'''/* AGENT_PORTAL_COMPLETION_V1
 * Complete employee self-service layer.
 * The prototype remains localStorage-based; production authorization must be server-side.
 */
(function(){
  function ensureAgentPortalData(){
    DB.agentRequests = Array.isArray(DB.agentRequests) ? DB.agentRequests : [];
    DB.agentTasks = Array.isArray(DB.agentTasks) ? DB.agentTasks : [];
    DB.agentNotifications = Array.isArray(DB.agentNotifications) ? DB.agentNotifications : [];
    DB.agentProfileRequests = Array.isArray(DB.agentProfileRequests) ? DB.agentProfileRequests : [];
    return DB;
  }
  function apAgent(){ return currentAgent ? currentAgent() : DB.agents.find(function(a){return a.id===SESSION.asAgentId;}); }
  function apNow(){ return typeof nowStamp==="function" ? nowStamp() : new Date().toLocaleString("fr-FR"); }
  function apId(prefix){ return prefix+"-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7); }
  function apDate(v){ if(!v) return "—"; try{return new Date(v).toLocaleDateString("fr-FR");}catch(e){return String(v);} }
  function apStatus(s){
    var x=String(s||"En attente").toLowerCase();
    if(x.includes("valid")||x.includes("accept")||x.includes("termin")) return badge("Validée");
    if(x.includes("refus")||x.includes("annul")) return badge("Refusée");
    if(x.includes("cours")||x.includes("attente")) return badge("En cours");
    return badge(s||"En attente");
  }
  function apNotify(title,text,type){
    ensureAgentPortalData();
    DB.agentNotifications.unshift({id:apId("notif"),agentId:SESSION.asAgentId,title:title,text:text,type:type||"info",date:apNow(),read:false});
  }
  function apRequests(){
    ensureAgentPortalData();
    return DB.agentRequests.filter(function(r){return r.agentId===SESSION.asAgentId;}).sort(function(a,b){return String(b.createdAt).localeCompare(String(a.createdAt));});
  }
  function apTasks(){
    ensureAgentPortalData();
    var own=DB.agentTasks.filter(function(t){return t.agentId===SESSION.asAgentId;});
    var mat=(DB.maternite||[]).filter(function(m){return m.agentId===SESSION.asAgentId;}).flatMap(function(m){
      return (m.taches||[]).filter(function(t){return t.responsable==="Agent";}).map(function(t){
        return {id:"mat-"+(t.id||t.titre||Math.random()),agentId:SESSION.asAgentId,title:t.titre||t.libelle||"Tâche maternité",description:t.description||"Tâche à compléter dans le dossier de maternité.",deadline:t.echeance||t.dateLimite||"",status:t.statut||"À faire",source:"Maternité"};
      });
    });
    return own.concat(mat);
  }
  function apOpenModal(title,body,actions){
    var mr=document.getElementById("modalRoot");
    mr.innerHTML='<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>'+esc(title)+'</h3><div class="spacer"></div><button class="close-x" id="closeModal" aria-label="Fermer">'+svg(I.x)+'</button></div><div class="modal-body">'+body+'</div><div class="modal-foot">'+actions+'</div></div></div>';
    var close=function(){mr.innerHTML="";};
    document.getElementById("closeModal").onclick=close;
    document.getElementById("overlay").onclick=function(e){if(e.target.id==="overlay")close();};
    return close;
  }
  window.openAgentRequestForm=function(type){
    var labels={absence:"Demande d'absence",formation:"Demande de formation",attestation:"Demande d'attestation",profil:"Modification de mes informations",teletravail:"Demande de télétravail",document:"Demande de document RH",social:"Demande d'action sociale",autre:"Autre demande RH"};
    var title=labels[type]||"Nouvelle demande RH";
    var body='<div class="form-grid"><div class="field"><label>Type</label><input value="'+esc(title)+'" disabled></div><div class="field"><label>Objet <span class="req">*</span></label><input id="apReqSubject" placeholder="Objet de la demande"></div><div class="field full"><label>Précisions <span class="req">*</span></label><textarea id="apReqDetails" placeholder="Décrivez votre demande, les dates ou les éléments utiles."></textarea></div>'+(type==="absence"?'<div class="field"><label>Date de début</label><input type="date" id="apReqStart"></div><div class="field"><label>Date de fin</label><input type="date" id="apReqEnd"></div>':"")+(type==="profil"?'<div class="field full"><label>Information à modifier</label><textarea id="apReqChange" placeholder="Ex. téléphone, adresse, situation familiale…"></textarea></div>':"")+'<div class="field full"><span class="hint">La demande sera transmise au circuit RH. Les modifications sensibles ne sont pas appliquées directement par l’agent.</span></div></div>';
    var close=apOpenModal(title,body,'<button class="btn" id="apReqCancel">Annuler</button><button class="btn primary" id="apReqSave">'+svg(I.check,'ic')+' Envoyer la demande</button>');
    document.getElementById("apReqCancel").onclick=close;
    document.getElementById("apReqSave").onclick=function(){
      var subject=document.getElementById("apReqSubject").value.trim(), details=document.getElementById("apReqDetails").value.trim();
      if(!subject||!details){toast("Objet et précisions sont obligatoires");return;}
      var extra=[];
      var st=document.getElementById("apReqStart"),en=document.getElementById("apReqEnd"),ch=document.getElementById("apReqChange");
      if(st&&st.value)extra.push("Du "+st.value);
      if(en&&en.value)extra.push("au "+en.value);
      if(ch&&ch.value.trim())extra.push("Modification demandée : "+ch.value.trim());
      ensureAgentPortalData();
      DB.agentRequests.unshift({id:apId("req"),agentId:SESSION.asAgentId,type:type||"autre",typeLabel:title,subject:subject,details:details+(extra.length?"

"+extra.join("
"):""),status:"En attente",createdAt:apNow(),updatedAt:apNow(),history:[{status:"En attente",date:apNow(),actor:"Agent"}]});
      apNotify("Demande envoyée",subject,"success");
      save();close();render();toast("Demande envoyée à la RH");
    };
  };
  window.openAgentTask=function(id){
    var t=apTasks().find(function(x){return x.id===id;});
    if(!t)return;
    var body='<div class="info-list"><div class="row"><span class="l">Tâche</span><span class="v">'+esc(t.title)+'</span></div><div class="row"><span class="l">Source</span><span class="v">'+esc(t.source||"RH")+'</span></div><div class="row"><span class="l">Échéance</span><span class="v">'+esc(apDate(t.deadline))+'</span></div><div class="row"><span class="l">Statut</span><span class="v">'+apStatus(t.status)+'</span></div></div><div class="field" style="margin-top:14px"><label>Commentaire / réponse</label><textarea id="apTaskComment" placeholder="Ajoutez les éléments utiles avant de soumettre."></textarea></div><div class="field" style="margin-top:10px"><label>Pièce jointe</label><input type="file" id="apTaskFile"><span class="hint">Prototype : le nom du fichier est enregistré comme métadonnée, pas le fichier binaire.</span></div>';
    var close=apOpenModal("Tâche à traiter",body,'<button class="btn" id="apTaskCancel">Fermer</button><button class="btn primary" id="apTaskDone">'+svg(I.check,'ic')+' Marquer comme traitée</button>');
    document.getElementById("apTaskCancel").onclick=close;
    document.getElementById("apTaskDone").onclick=function(){
      var real=DB.agentTasks.find(function(x){return x.id===id;});
      if(real){real.status="Terminée";real.completedAt=apNow();real.comment=document.getElementById("apTaskComment").value.trim();var f=document.getElementById("apTaskFile");real.attachmentName=f&&f.files[0]?f.files[0].name:"";}
      apNotify("Tâche terminée",t.title,"success");save();close();render();toast("Tâche marquée comme terminée");
    };
  };
  window.markAgentNotificationsRead=function(){
    ensureAgentPortalData();
    DB.agentNotifications.filter(function(n){return n.agentId===SESSION.asAgentId;}).forEach(function(n){n.read=true;});
    save();render();
  };
  window.openAgentProfileRequest=function(){openAgentRequestForm("profil");};
  window.openAgentDocumentRequest=function(){openAgentRequestForm("document");};
  window.openAgentLeaveRequest=function(){openAgentRequestForm("absence");};
  window.openAgentTrainingRequest=function(){openAgentRequestForm("formation");};

  window.renderAgentProfile=function(){
    var a=apAgent(); if(!a)return '<div class="empty">Profil agent introuvable.</div>';
    var children=(a.enfants||[]).length, docs=agentDocs().length, req=apRequests().filter(function(r){return r.type==="profil";}).length;
    return '<div class="detail-head"><div class="av">'+esc((a.prenom||"")[0]+(a.nom||"")[0])+'</div><div><h2>Mon profil</h2><div class="meta">'+esc(agentName(a.id))+' · '+esc(a.matricule||"Matricule non renseigné")+'</div></div><div class="spacer"></div><button class="btn primary" onclick="openAgentProfileRequest()">'+svg(I.edit,'ic')+' Demander une modification</button></div>'+
    '<div class="kpi-grid"><div class="kpi"><div class="k-lbl">Enfants à charge</div><div class="k-val">'+children+'</div></div><div class="kpi"><div class="k-lbl">Documents personnels</div><div class="k-val">'+docs+'</div></div><div class="kpi"><div class="k-lbl">Demandes de modification</div><div class="k-val">'+req+'</div></div></div>'+
    '<div class="detail-cols"><div class="panel"><div class="panel-head"><h3>Coordonnées</h3></div><div class="panel-body"><div class="info-list"><div class="row"><span class="l">Nom</span><span class="v">'+esc(a.nom||"—")+'</span></div><div class="row"><span class="l">Prénom</span><span class="v">'+esc(a.prenom||"—")+'</span></div><div class="row"><span class="l">Date de naissance</span><span class="v">'+esc(a.dateNaissance||"—")+'</span></div><div class="row"><span class="l">Situation familiale</span><span class="v">'+esc(a.situationFamiliale||"—")+'</span></div><div class="row"><span class="l">Enfants à charge</span><span class="v">'+children+'</span></div><div class="row"><span class="l">Email professionnel</span><span class="v">'+esc(a.email||a.emailPro||"—")+'</span></div><div class="row"><span class="l">Téléphone</span><span class="v">'+esc(a.telephone||a.tel||"—")+'</span></div></div></div></div>'+
    '<div class="panel"><div class="panel-head"><h3>Situation professionnelle</h3></div><div class="panel-body"><div class="info-list"><div class="row"><span class="l">Direction</span><span class="v">'+esc(a.direction||"—")+'</span></div><div class="row"><span class="l">Poste</span><span class="v">'+esc(a.poste||a.fonction||"—")+'</span></div><div class="row"><span class="l">Statut</span><span class="v">'+esc(a.statut||"—")+'</span></div><div class="row"><span class="l">Grade / échelon</span><span class="v">'+esc(a.grade||"—")+' / '+esc(a.echelon||"—")+'</span></div><div class="row"><span class="l">Entrée</span><span class="v">'+esc(a.dateEntree||"—")+'</span></div><div class="row"><span class="l">Supérieur hiérarchique</span><span class="v">'+esc(a.superieurId?agentName(a.superieurId):"—")+'</span></div><div class="row"><span class="l">Quotité</span><span class="v">'+esc(a.quotite||100)+' %</span></div></div></div></div></div>';
  };

  window.renderAgentRequests=function(){
    var rs=apRequests();
    var pending=rs.filter(function(r){return r.status==="En attente"||r.status==="En cours";}).length;
    var rows=rs.map(function(r){return '<div class="mini-row"><div class="av" style="width:30px;height:30px">'+esc((r.typeLabel||"RH").slice(0,2).toUpperCase())+'</div><div><div class="who">'+esc(r.subject)+'</div><div class="det">'+esc(r.typeLabel||r.type)+' · '+esc(apDate(r.createdAt))+'</div></div><div class="spacer"></div>'+apStatus(r.status)+'</div>';}).join("");
    return '<div class="detail-head"><div><h2>Mes demandes</h2><div class="meta">Suivre toutes vos demandes adressées à la RH</div></div><div class="spacer"></div><button class="btn primary" onclick="openAgentRequestForm()">'+svg(I.plus,'ic')+' Nouvelle demande</button></div>'+
      '<div class="kpi-grid"><div class="kpi"><div class="k-lbl">En cours</div><div class="k-val">'+pending+'</div></div><div class="kpi"><div class="k-lbl">Total</div><div class="k-val">'+rs.length+'</div></div><div class="kpi"><div class="k-lbl">Documents demandés</div><div class="k-val">'+rs.filter(function(r){return r.type==="document";}).length+'</div></div></div>'+
      '<div class="toolbar"><button class="btn sm" onclick="openAgentLeaveRequest()">Absence</button><button class="btn sm" onclick="openAgentTrainingRequest()">Formation</button><button class="btn sm" onclick="openAgentDocumentRequest()">Attestation / document</button><button class="btn sm" onclick="openAgentRequestForm(\'teletravail\')">Télétravail</button><button class="btn sm" onclick="openAgentRequestForm(\'social\')">Action sociale</button><button class="btn sm" onclick="openAgentProfileRequest()">Modifier mes informations</button></div>'+
      '<div class="panel"><div class="panel-head"><h3>Historique</h3></div><div class="panel-body">'+(rows||'<div class="empty">Aucune demande pour le moment.</div>')+'</div></div>';
  };

  window.renderAgentTasks=function(){
    var ts=apTasks(),open=ts.filter(function(t){return !/termin/i.test(String(t.status));});
    var rows=ts.map(function(t){return '<div class="tache-row"><div style="flex:1"><div class="cell-name">'+esc(t.title)+'</div><div class="cell-sub">'+esc(t.description||"")+'</div><div class="cell-sub" style="margin-top:5px">Échéance : '+esc(apDate(t.deadline))+' · '+esc(t.source||"RH")+'</div></div><div>'+apStatus(t.status)+'</div><button class="btn sm" onclick="openAgentTask(\''+esc(t.id)+'\')">'+(/termin/i.test(String(t.status))?"Voir":"Traiter")+'</button></div>';}).join("");
    return '<div class="detail-head"><div><h2>Mes tâches</h2><div class="meta">Actions RH qui nécessitent une réponse ou un document de votre part</div></div><div class="spacer"></div><span class="tag">'+open.length+' à traiter</span></div><div class="panel"><div class="panel-body"><div class="tache-list">'+(rows||'<div class="empty">Aucune tâche.</div>')+'</div></div></div>';
  };

  window.renderAgentNotifications=function(){
    ensureAgentPortalData();
    var ns=DB.agentNotifications.filter(function(n){return n.agentId===SESSION.asAgentId;}).sort(function(a,b){return String(b.date).localeCompare(String(a.date));});
    var unread=ns.filter(function(n){return !n.read;}).length;
    var req=apRequests().filter(function(r){return r.status==="En attente"||r.status==="En cours";});
    req.forEach(function(r){
      if(!ns.some(function(n){return n.requestId===r.id;})) ns.push({id:apId("notif"),agentId:SESSION.asAgentId,title:"Demande en cours",text:r.subject,date:r.updatedAt||r.createdAt,type:"info",read:false,requestId:r.id});
    });
    var rows=ns.map(function(n){return '<div class="mini-row" style="'+(!n.read?'background:var(--primary-soft);':'')+'"><div class="av">'+(!n.read?"!":"✓")+'</div><div><div class="who">'+esc(n.title)+'</div><div class="det">'+esc(n.text||"")+' · '+esc(apDate(n.date))+'</div></div><div class="spacer"></div>'+badge(n.type==="success"?"Info":"Notification")+'</div>';}).join("");
    return '<div class="detail-head"><div><h2>Notifications</h2><div class="meta">'+unread+' non lue(s)</div></div><div class="spacer"></div><button class="btn" onclick="markAgentNotificationsRead()">Tout marquer comme lu</button></div><div class="panel"><div class="panel-body">'+(rows||'<div class="empty">Aucune notification.</div>')+'</div></div>';
  };

  window.renderAgentDocuments=function(){
    var ds=agentDocs(), cats={};
    ds.forEach(function(d){var c=d.categorie||d.category||d.type||"Autres";(cats[c]||(cats[c]=[])).push(d);});
    var body=Object.keys(cats).sort().map(function(c){return '<div class="doc-cat"><div class="doc-cat-head open"><span>'+esc(c)+'</span><span class="tag">'+cats[c].length+'</span></div><div class="doc-cat-body">'+cats[c].map(function(d){return '<div class="doc-row"><div style="flex:1"><div class="cell-name">'+esc(d.nom||d.name||d.titre||d.type||"Document")+'</div><div class="cell-sub">'+esc(d.date||d.createdAt||"")+' · '+esc(d.statut||"Disponible")+'</div></div><button class="btn sm" onclick="toast(\'Aperçu du document\')">Aperçu</button></div>';}).join("")+'</div></div>';}).join("");
    return '<div class="detail-head"><div><h2>Mes documents</h2><div class="meta">'+ds.length+' document(s) accessibles</div></div><div class="spacer"></div><button class="btn primary" onclick="openAgentDocumentRequest()">Demander un document</button></div><div class="doc-tree">'+(body||'<div class="empty">Aucun document personnel accessible.</div>')+'</div>';
  };

  window.renderAgentPay=function(){
    var a=apAgent(), ps=agentPays(), latest=ps[0];
    return '<div class="detail-head"><div><h2>Ma rémunération</h2><div class="meta">Bulletins et éléments de rémunération personnels</div></div><div class="spacer"></div>'+(latest?'<button class="btn primary" onclick="openBulletinDetail(\''+esc(latest.id)+'\')">Dernier bulletin</button>':"")+'</div>'+
      '<div class="kpi-grid"><div class="kpi"><div class="k-lbl">Brut mensuel</div><div class="k-val" style="font-size:22px">'+fmtMoney(a&&a.salaireBrutMensuel)+'</div></div><div class="kpi"><div class="k-lbl">Net dernier bulletin</div><div class="k-val" style="font-size:22px">'+fmtMoney(latest&&latest.net)+'</div></div><div class="kpi"><div class="k-lbl">Bulletins disponibles</div><div class="k-val">'+ps.length+'</div></div></div>'+
      '<div class="table-wrap"><table><thead><tr><th>Période</th><th>Statut</th><th style="text-align:right">Brut</th><th style="text-align:right">Net</th><th></th></tr></thead><tbody>'+(ps.map(function(p){return '<tr><td class="cell-name">'+esc(p.periode)+'</td><td>'+apStatus(p.statut)+'</td><td class="num">'+fmtMoney(p.brut)+'</td><td class="num">'+fmtMoney(p.net)+'</td><td class="row-actions"><button class="btn sm" onclick="openBulletinDetail(\''+esc(p.id)+'\')">Consulter</button></td></tr>';}).join("")||'<tr><td colspan="5" class="empty">Aucun bulletin disponible.</td></tr>')+'</tbody></table></div>';
  };

  window.renderAgentCareer=function(){
    var a=apAgent(), items=agentCareer();
    var body=items.map(function(x){return '<div class="wf-item"><div class="wf-dot"></div><div class="wf-body"><div class="wf-top"><strong>'+esc(x.libelle||x.type||x.evenement||"Évolution professionnelle")+'</strong><span class="wf-date">'+esc(apDate(x.date))+'</span></div><div class="wf-actor">'+esc(x.description||x.poste||x.grade||"")+'</div></div></div>';}).join("");
    return '<div class="detail-head"><div><h2>Ma carrière</h2><div class="meta">Historique de votre parcours professionnel</div></div><div class="spacer"></div><button class="btn" onclick="openAgentRequestForm(\'autre\')">Exprimer un souhait d'évolution</button></div><div class="detail-cols"><div class="panel"><div class="panel-head"><h3>Situation actuelle</h3></div><div class="panel-body"><div class="info-list"><div class="row"><span class="l">Poste</span><span class="v">'+esc(a&& (a.poste||a.fonction)||"—")+'</span></div><div class="row"><span class="l">Grade</span><span class="v">'+esc(a&&a.grade||"—")+'</span></div><div class="row"><span class="l">Échelon</span><span class="v">'+esc(a&&a.echelon||"—")+'</span></div><div class="row"><span class="l">Ancienneté</span><span class="v">'+esc(a&&a.dateEntree||"—")+'</span></div></div></div></div><div class="panel"><div class="panel-head"><h3>Parcours</h3></div><div class="panel-body"><div class="wf-timeline">'+(body||'<div class="empty">Aucun événement de carrière enregistré.</div>')+'</div></div></div></div>';
  };

  window.renderAgentTraining=function(){
    var fs=agentForms();
    var body=fs.map(function(f){return '<tr><td class="cell-name">'+esc(f.intitule||f.nom||f.formation||"Formation")+'</td><td>'+esc(f.organisme||f.provider||"—")+'</td><td>'+esc(f.date||f.dateDebut||"—")+'</td><td>'+esc(f.duree||"—")+'</td><td>'+apStatus(f.statut||"Terminée")+'</td><td>'+((f.evaluationChaud||f.evaluationFroid)?'<span class="tag">Évaluations</span>':"—")+'</td></tr>';}).join("");
    return '<div class="detail-head"><div><h2>Mes formations</h2><div class="meta">Formations suivies, demandes et évaluations</div></div><div class="spacer"></div><button class="btn primary" onclick="openAgentTrainingRequest()">Demander une formation</button></div><div class="panel"><div class="panel-head"><h3>Historique</h3><div class="spacer"></div><span class="tag">'+fs.length+' formation(s)</span></div><div class="table-wrap" style="border:none;box-shadow:none"><table><thead><tr><th>Formation</th><th>Organisme</th><th>Date</th><th>Durée</th><th>Statut</th><th>Évaluations</th></tr></thead><tbody>'+(body||'<tr><td colspan="6" class="empty">Aucune formation enregistrée.</td></tr>')+'</tbody></table></div></div>';
  };

  window.renderAgentReviews=function(){
    var rs=agentReviews();
    var body=rs.map(function(r){return '<div class="panel" style="margin-bottom:10px"><div class="panel-head"><h3>'+esc(r.campagne||r.periode||"Entretien / évaluation")+'</h3><div class="spacer"></div>'+esc(r.note!=null?r.note+"/20":"—")+'</div><div class="panel-body"><div class="cell-sub">Responsable</div><div style="margin-bottom:10px">'+esc(r.commentaireResponsable||r.commentaireManager||"Aucun commentaire")+'</div><div class="cell-sub">Votre commentaire</div><div>'+esc(r.commentaireAgent||"Non renseigné")+'</div><div style="margin-top:10px"><button class="btn sm" onclick="openAgentReviewComment(\''+esc(r.id)+'\')">Ajouter / modifier mon commentaire</button></div></div></div>';}).join("");
    return '<div class="detail-head"><div><h2>Mes entretiens</h2><div class="meta">Évaluations et possibilité de formuler vos observations</div></div></div>'+(body||'<div class="empty">Aucun entretien ou évaluation disponible.</div>');
  };
  window.openAgentReviewComment=function(id){
    var r=DB.notations.find(function(x){return x.id===id;});if(!r)return;
    var body='<div class="field"><label>Votre commentaire</label><textarea id="apReviewComment">'+esc(r.commentaireAgent||"")+'</textarea><span class="hint">Votre commentaire est conservé avec l’évaluation et transmis dans le circuit prévu.</span></div>';
    var close=apOpenModal("Mon commentaire",body,'<button class="btn" id="apRc">Annuler</button><button class="btn primary" id="apRs">Enregistrer</button>');
    document.getElementById("apRc").onclick=close;
    document.getElementById("apRs").onclick=function(){r.commentaireAgent=document.getElementById("apReviewComment").value.trim();r.dateCommentaireAgent=apNow();apNotify("Commentaire d'évaluation enregistré",r.campagne||"Évaluation","success");save();close();render();toast("Commentaire enregistré");};
  };

  window.renderAgentLife=function(){
    var a=apAgent();
    return '<div class="detail-head"><div><h2>Ma vie professionnelle</h2><div class="meta">Les informations pratiques liées à votre vie au sein de l’OPH</div></div></div><div class="kpi-grid"><div class="kpi"><div class="k-lbl">Quotité de travail</div><div class="k-val">'+esc(a&&a.quotite||100)+' %</div><div class="k-meta mut">Temps de travail</div></div><div class="kpi"><div class="k-lbl">Pause déjeuner</div><div class="k-val">30 min</div><div class="k-meta mut">Règle affichée</div></div><div class="kpi"><div class="k-lbl">Télétravail</div><div class="k-val">—</div><div class="k-meta mut">À consulter auprès des RH</div></div></div><div class="panels"><div class="panel"><div class="panel-head"><h3>Organisation</h3></div><div class="panel-body"><div class="info-list"><div class="row"><span class="l">Horaires habituels</span><span class="v">07:30–15:30</span></div><div class="row"><span class="l">Vendredi</span><span class="v">07:30–14:30</span></div><div class="row"><span class="l">Pause déjeuner</span><span class="v">30 min</span></div><div class="row"><span class="l">Direction</span><span class="v">'+esc(a&&a.direction||"—")+'</span></div></div></div></div><div class="panel"><div class="panel-head"><h3>Services & dispositifs</h3></div><div class="panel-body"><div class="toolbar"><button class="btn sm" onclick="openAgentRequestForm(\'teletravail\')">Télétravail</button><button class="btn sm" onclick="openAgentRequestForm(\'social\')">Action sociale</button><button class="btn sm" onclick="openAgentDocumentRequest()">Attestation / document</button><button class="btn sm" onclick="go(\'aide-agent\')">Contacts RH</button></div><p class="hint">Les informations contractuelles et dispositifs disponibles doivent être validés par la RH. Cette vue n’autorise pas une modification directe des données administratives.</p></div></div></div>';
