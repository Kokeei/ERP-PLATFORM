  window.renderAgentSearch=function(){
    var q=(view.search||"").trim().toLowerCase(), ds=agentDocs(), fs=agentForms(), rs=apRequests(), hits=[];
    ds.forEach(function(d){var text=[d.nom,d.name,d.titre,d.type,d.categorie,d.category].join(" ").toLowerCase();if(!q||text.includes(q))hits.push({type:"Document",title:d.nom||d.name||d.titre||d.type||"Document",meta:d.categorie||d.category||"Mes documents",action:"mes-documents"});});
    fs.forEach(function(f){var text=[f.intitule,f.nom,f.formation,f.organisme,f.provider].join(" ").toLowerCase();if(!q||text.includes(q))hits.push({type:"Formation",title:f.intitule||f.nom||f.formation||"Formation",meta:f.organisme||f.provider||"Mes formations",action:"mes-formations"});});
    rs.forEach(function(r){var text=[r.subject,r.details,r.typeLabel].join(" ").toLowerCase();if(!q||text.includes(q))hits.push({type:"Demande",title:r.subject,meta:r.typeLabel||r.type,action:"mes-demandes"});});
    var rows=hits.slice(0,50).map(function(h){return '<div class="mini-row"><div class="av">'+esc(h.type.slice(0,1))+'</div><div><div class="who">'+esc(h.title)+'</div><div class="det">'+esc(h.type)+' · '+esc(h.meta)+'</div></div><div class="spacer"></div><button class="btn sm" onclick="go(\''+esc(h.action)+'\')">Ouvrir</button></div>';}).join("");
    return '<div class="detail-head"><div><h2>Recherche RH</h2><div class="meta">Recherche limitée aux informations auxquelles vous avez accès</div></div></div><div class="toolbar"><div class="search" style="max-width:none"><span>'+svg(I.search,'ic')+'</span><input id="agentSearchInput" value="'+esc(view.search||"")+'" placeholder="Document, formation, demande…" oninput="view.search=this.value;render();"></div></div><div class="panel"><div class="panel-head"><h3>Résultats</h3><div class="spacer"></div><span class="tag">'+hits.length+' résultat(s)</span></div><div class="panel-body">'+(rows||'<div class="empty">Aucun résultat.</div>')+'</div></div>';
  };

  window.renderAgentMaternity=function(){
    var a=apAgent(), ms=(DB.maternite||[]).filter(function(m){return m.agentId===a.id;}), m=ms[0], ts=apTasks().filter(function(t){return t.source==="Maternité";});
    var done=ts.filter(function(t){return /termin/i.test(String(t.status));}).length;
    return '<div class="detail-head"><div><h2>Maternité / parentalité</h2><div class="meta">Suivi administratif, tâches et pièces à fournir</div></div><div class="spacer"></div><button class="btn" onclick="openAgentRequestForm(\'document\')">Demander un document</button></div><div class="kpi-grid"><div class="kpi"><div class="k-lbl">Dossier</div><div class="k-val">'+(m?"Ouvert":"—")+'</div></div><div class="kpi"><div class="k-lbl">Tâches</div><div class="k-val">'+done+' / '+ts.length+'</div></div><div class="kpi"><div class="k-lbl">Documents</div><div class="k-val">'+agentDocs().filter(function(d){return /mater|parent/i.test(String(d.categorie||d.type||""));}).length+'</div></div></div><div class="panel"><div class="panel-head"><h3>Mes actions</h3></div><div class="panel-body"><div class="tache-list">'+(ts.map(function(t){return '<div class="tache-row"><div style="flex:1"><div class="cell-name">'+esc(t.title)+'</div><div class="cell-sub">Échéance : '+esc(apDate(t.deadline))+'</div></div>'+apStatus(t.status)+'<button class="btn sm" onclick="openAgentTask(\''+esc(t.id)+'\')">'+(/termin/i.test(String(t.status))?"Consulter":"Traiter")+'</button></div>';}).join("")||'<div class="empty">Aucune tâche administrative en cours.</div>')+'</div></div></div><div class="panel" style="margin-top:16px"><div class="panel-head"><h3>Protection des données</h3></div><div class="panel-body"><p class="hint">Cette vue présente uniquement les actions administratives nécessaires. Les données médicales ne sont pas exposées dans l’espace agent.</p></div></div>';
