name: RH Agent Portal - Playwright

on:
  pull_request:
    branches: [main]
    paths:
      - "rh/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "playwright.config.js"
      - ".github/workflows/**"
  push:
    branches: [main, "feature/espace-agent-rh"]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        run: npm test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
